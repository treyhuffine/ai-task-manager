<style>

  #ri-additions-sketch .ri-search input::placeholder { color: var(--ri-dim); }
  #ri-additions-sketch .ri-row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--ri-line); }

  #ri-additions-sketch .ri-actions { display: flex; gap: 5px; align-items: center; }
  #ri-additions-sketch .ri-btn { border: 1px solid var(--ri-line); border-radius: 7px; background: var(--ri-bg); min-height: 32px; padding: 5px 10px; white-space: nowrap; }
  #ri-additions-sketch .ri-btn.ri-tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 0; background: transparent; }
  #ri-additions-sketch .ri-btn.ri-tab[aria-pressed="true"] { border-bottom-color: var(--ri-ink); }
  #ri-additions-sketch .ri-quiet { border: 0; background: transparent; }
  #ri-additions-sketch .ri-primary { background: var(--ri-accent); color: var(--ri-on-accent) !important; border-color: var(--ri-accent); }
  #ri-additions-sketch .ri-more { position: relative; }
  #ri-additions-sketch .ri-menu { position: absolute; right: 0; top: 36px; width: 154px; background: var(--ri-bg); border: 1px solid var(--ri-line); border-radius: 9px; padding: 5px; z-index: 5; box-shadow: 0 5px 20px light-dark(#00000015,#00000055); }
  #ri-additions-sketch .ri-menu button { display: block; text-align: left; width: 100%; border: 0; padding: 8px 10px; background: transparent; border-radius: 5px; }
  #ri-additions-sketch .ri-menu button:hover { background: var(--ri-soft); }
  #ri-additions-sketch .ri-off { color: var(--ri-dim); background: var(--ri-soft); padding: 0 6px; border-radius: 4px; font-size: 12px; }
  #ri-additions-sketch .ri-switch { appearance: none; display: inline-block; width: 30px; height: 18px; margin: 0 4px; border: 1px solid var(--ri-line); border-radius: 12px; background: var(--ri-soft); position: relative; }
  #ri-additions-sketch .ri-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ri-dim); }
  #ri-additions-sketch .ri-switch:checked { background: var(--ri-accent); }
  #ri-additions-sketch .ri-switch:checked::after { left: 14px; background: var(--ri-on-accent); }
  #ri-additions-sketch .ri-back { margin: 12px 0 20px; }
  #ri-additions-sketch .ri-detail h3 { margin: 14px 0 3px; font-size: 19px; font-weight: 500; }
  #ri-additions-sketch .ri-detail p { margin: 5px 0 18px; color: var(--ri-dim); }
  #ri-additions-sketch .ri-setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 0; border-top: 1px solid var(--ri-line); }
  #ri-additions-sketch .ri-form { display: grid; gap: 8px; margin: 18px 0; }
  #ri-additions-sketch .ri-field { border: 1px solid var(--ri-line); border-radius: 7px; padding: 8px 10px; background: var(--ri-bg); width: 100%; }
  #ri-additions-sketch .ri-field option { background: var(--ri-bg); }
  #ri-additions-sketch textarea.ri-field { resize: vertical; min-height: 100px; }
  #ri-additions-sketch .ri-preview { background: var(--ri-soft); border-radius: 9px; padding: 16px; margin: 18px 0; }
  #ri-additions-sketch .ri-preview-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--ri-line); }
  #ri-additions-sketch .ri-status { min-height: 23px; padding-top: 12px; color: var(--ri-dim); font-size: 12px; }
  #ri-additions-sketch .ri-empty { color: var(--ri-dim); padding: 30px 0; }
  #ri-additions-sketch .ri-section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 12px; }
  #ri-additions-sketch .ri-section-heading h3 { font-size: 14px; font-weight: 500; margin: 0; }
  #ri-additions-sketch .ri-section-heading .ri-btn { font-size: 12px; color: var(--ri-dim); }
  #ri-additions-sketch .ri-quick-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; }
  #ri-additions-sketch .ri-quick { display: flex; align-items: center; gap: 8px; min-width: 0; background: var(--ri-soft); border: 1px solid transparent; border-radius: 8px; padding: 10px; text-align: left; }
  #ri-additions-sketch .ri-quick > span { min-width: 0; overflow-wrap: anywhere; font-size: 12px; }
  #ri-additions-sketch .ri-quick svg { flex: none; }
  #ri-additions-sketch .ri-catalog { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
  #ri-additions-sketch .ri-catalog-item { border: 1px solid var(--ri-line); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  #ri-additions-sketch .ri-card-title { display: flex; gap: 10px; align-items: center; font-weight: 500; }
  #ri-additions-sketch .ri-card-title button { border: 0; background: transparent; font-weight: 500; padding: 0; text-align: left; }
  #ri-additions-sketch .ri-catalog-item .ri-description { margin: 9px 0 14px; flex: 1; }
  #ri-additions-sketch .ri-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
  #ri-additions-sketch .ri-card-footer .ri-btn { font-size: 12px; }
  #ri-additions-sketch .ri-catalog-heading { padding-top: 12px; margin-top: 18px; border-top: 1px solid var(--ri-line); }
  #ri-additions-sketch .ri-catalog-heading h3 { font-size: 17px; }
  #ri-additions-sketch .ri-window { min-height: 500px; }
  #ri-additions-sketch .ri-stage { min-height: 0; }
  #ri-additions-sketch [hidden] { display: none !important; }
  @media (max-width: 440px) { #ri-additions-sketch .ri-stage { padding: 10px 0; min-height: 690px; } #ri-additions-sketch .ri-window { padding: 17px; } #ri-additions-sketch .ri-row { grid-template-columns: 30px minmax(0,1fr); gap: 8px; padding: 13px 0; } #ri-additions-sketch .ri-actions { grid-column: 2; justify-content: flex-end; } #ri-additions-sketch .ri-search input { font-size: 16px; } }
  @media (max-width: 440px) { #ri-additions-sketch .ri-catalog { grid-template-columns: 1fr; } #ri-additions-sketch .ri-quick-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } #ri-additions-sketch .ri-stage { min-height: 0; } }
  @media (pointer: coarse) { #ri-additions-sketch .ri-btn, #ri-additions-sketch .ri-menu button { min-height: 44px; } #ri-additions-sketch .ri-switch { margin: 12px 7px; } }
</style>
<div id="ri-additions-sketch" class="viz-dotted-background" aria-label="Ri discovery and installed extensions together">
  <div class="ri-stage"><div class="ri-window" data-version="menu" aria-label="Discover extensions and manage your additions"></div></div>
</div>
<script>
(() => {
  const root = document.getElementById('ri-additions-sketch');
  const items = [
    { id: 'finances', name: 'Finances', description: 'See where your money goes.', icon: 'wallet', ui: true, installed: true, publisher: 'Ri', keywords: 'money budget spending bank', prompt: 'Help me understand my spending this month.' },
    { id: 'people', name: 'People', description: 'Keep up with the people you know.', icon: 'contact', ui: true, installed: true, publisher: 'Ri', keywords: 'crm contacts friends relationships', prompt: 'Who should I catch up with this week?' },
    { id: 'gmail', name: 'Gmail', description: 'Find emails and prepare replies.', icon: 'mail', account: true, installed: true, publisher: 'Google', keywords: 'email inbox messages', prompt: 'Find the emails I need to reply to.' },
    { id: 'proposal', name: 'Proposal style', description: 'Write proposals your way.', icon: 'file-pen-line', installed: true, publisher: 'You', keywords: 'skill writing format voice', prompt: 'Help me write a proposal using my proposal style.' },
    { id: 'calendar', name: 'Google Calendar', description: 'Plan around what is on your calendar.', icon: 'calendar-days', account: true, installed: false, publisher: 'Google', keywords: 'schedule meetings events time', prompt: 'Help me plan my week.' },
    { id: 'meeting', name: 'Meeting prep', description: 'Arrive with the context you need.', icon: 'notebook-pen', installed: false, publisher: 'Ri', keywords: 'brief meetings preparation skill', prompt: 'Help me prepare for my next meeting.' },
    { id: 'travel', name: 'Travel', description: 'Keep your trips and plans together.', icon: 'plane', ui: true, installed: false, publisher: 'Ri', keywords: 'personal trips flights vacation itinerary', prompt: 'Help me plan my next trip.' },
    { id: 'presentations', name: 'Presentations', description: 'Turn your ideas into a clear presentation.', icon: 'presentation', installed: false, publisher: 'Ri', keywords: 'slides powerpoint deck writing create', prompt: 'Help me make a presentation from my notes.' },
    { id: 'slack', name: 'Slack', description: 'Catch up on conversations and decisions.', icon: 'messages-square', account: true, installed: false, publisher: 'Slack', keywords: 'work chat messages team', prompt: 'Catch me up on recent team decisions.' },
    { id: 'notion', name: 'Notion', description: 'Work with your pages and knowledge.', icon: 'book-open', account: true, installed: false, publisher: 'Notion', keywords: 'work notes documents knowledge', prompt: 'Find the notes related to my current project.' }
  ];
  const states = {};
  const windows = {};
  const esc = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (label, action, id = '', classes = '') => `<button type="button" class="ri-btn cursor-interaction ${classes}" data-action="${action}" data-id="${id}">${label}</button>`;
  function save() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: null, privateContent: { version: 2, states } }).catch(() => {});
  }
  function hydrate(snapshot) {
    const saved = snapshot?.privateContent?.version === 2 ? snapshot.privateContent.states : null;
    for (const key of ['menu']) {
      const prior = saved?.[key] || {};
      states[key] = { tab: prior.tab === 'yours' ? 'yours' : 'browse', query: typeof prior.query === 'string' ? prior.query : '', installed: items.filter(x => typeof prior.installed?.includes === 'function' ? prior.installed.includes(x.id) : x.installed).map(x => x.id), off: items.filter(x => prior.off?.includes?.(x.id)).map(x => x.id), screen: ['list','settings','connect','remove','chat','app'].includes(prior.screen) ? prior.screen : 'list', selected: items.some(x => x.id === prior.selected) ? prior.selected : '', menu: items.some(x => x.id === prior.menu) ? prior.menu : '', notice: typeof prior.notice === 'string' ? prior.notice : '', currency: prior.currency || 'USD', instructions: prior.instructions || 'Start with the client goal, explain the proposed work, and finish with timing and price.' };
    }
  }
  function render(key) {
    const state = states[key], win = windows[key];
    const item = items.find(x => x.id === state.selected);
    let content = '';
    if (state.screen === 'list') {
      const search = `<label class="ri-search">${icon('search')}<input aria-label="Search extensions" placeholder="Search extensions" value="${esc(state.query)}"></label>`;
      if (state.tab === 'browse') {
        const shortcuts = items.filter(x => state.installed.includes(x.id)).slice(0,4).map(x => `<button type="button" class="ri-quick cursor-interaction" data-action="${state.off.includes(x.id) ? 'settings' : 'use'}" data-id="${x.id}">${icon(x.icon)}<span>${x.name}${state.off.includes(x.id) ? ' · Off' : ''}</span></button>`).join('');
        content = `${search}<div class="ri-your-strip"><div class="ri-section-heading"><h3>Yours</h3>${button(`Manage all (${state.installed.length})`,'yours','','ri-quiet')}</div><div class="ri-quick-grid">${shortcuts}</div></div><div class="ri-section-heading ri-catalog-heading"><h3 class="ri-result-title">Browse</h3></div><div class="ri-list ri-catalog"></div>`;
      } else content = `${button('← Browse','browse','','ri-quiet ri-back')}<div class="ri-section-heading"><h3>Yours</h3><span class="ri-note">${state.installed.length} added</span></div>${search}<div class="ri-list"></div>`;
    } else if (item) {
      content = `${button('← Extensions','back','','ri-quiet ri-back')}<div class="ri-detail"><div class="ri-icon">${icon(item.icon)}</div><h3>${item.name}</h3><p>${item.description}</p>`;
      if (state.screen === 'settings') {
        const added = state.installed.includes(item.id);
        content += `<div class="ri-note">By ${item.publisher}</div>`;
        if (added) {
          content += `<label class="ri-setting"><span>Enabled in Ri<div class="ri-note">Turn off to pause use and keep your setup.</div></span><input type="checkbox" class="ri-switch cursor-interaction" data-toggle="${item.id}" ${state.off.includes(item.id) ? '' : 'checked'}></label>`;
          if (item.account) content += `<div class="ri-setting"><span>Connected account<div class="ri-note">alex@example.com</div></span>${button('Disconnect','disconnect',item.id,'ri-quiet')}</div>`;
          if (item.id === 'finances') content += `<label class="ri-form">Currency<select class="ri-field" data-setting="currency"><option ${state.currency === 'USD' ? 'selected' : ''}>USD</option><option ${state.currency === 'EUR' ? 'selected' : ''}>EUR</option><option ${state.currency === 'GBP' ? 'selected' : ''}>GBP</option></select></label>`;
          if (item.id === 'proposal') content += `<label class="ri-form">Your instructions<textarea class="ri-field" data-setting="instructions">${esc(state.instructions)}</textarea></label>`;
          content += `<div class="ri-setting">${button(item.ui ? 'Open' : 'Try in chat','use',item.id)}${button('Remove','remove',item.id,'ri-quiet')}</div>`;
        } else content += button(item.account ? 'Connect account' : 'Add to Ri','add',item.id,'ri-primary');
      } else if (state.screen === 'connect') {
        content += `<div class="ri-preview">Connect the account you want Ri to use.<div class="ri-note">Example account for this preview</div></div>${button('Connect alex@example.com','finish-add',item.id,'ri-primary')}`;
      } else if (state.screen === 'remove') {
        content += `<p>Remove ${item.name} from Ri?</p><div class="ri-note">Your saved data stays. You can add it again later.</div><div class="ri-setting">${button('Keep it','settings',item.id)}${button('Remove','finish-remove',item.id)}</div>`;
      } else if (state.screen === 'chat') {
        content += `<label class="ri-form">New chat<textarea class="ri-field" aria-label="Chat draft">${esc(item.prompt)}</textarea></label><div class="ri-note">Draft prepared. Nothing sent.</div>`;
      } else {
        const sample = item.id === 'finances' ? '<div>Recent spending</div><div class="ri-preview-line"><span>Groceries</span><span>$82.40</span></div><div class="ri-preview-line"><span>Coffee</span><span>$6.00</span></div>' : item.id === 'travel' ? '<div>Upcoming trips</div><div class="ri-preview-line"><span>Weekend in Seattle</span><span>Planning</span></div><div class="ri-preview-line"><span>Summer in Portugal</span><span>Idea</span></div>' : '<div>People to catch up with</div><div class="ri-preview-line"><span>Alex Chen</span><span>Last spoke 2 weeks ago</span></div><div class="ri-preview-line"><span>Jordan Lee</span><span>Follow up next week</span></div>';
        content += `<div class="ri-note">Example app view</div><div class="ri-preview">${sample}</div>${button('Settings','settings',item.id,'ri-quiet')}`;
      }
      content += '</div>';
    }
    win.innerHTML = `<div class="ri-heading"><h2>Extensions</h2><span class="ri-note">Concept</span></div>${content}<div class="ri-status" aria-live="polite">${esc(state.notice)}</div>`;
    if (state.screen === 'list') {
      renderRows(key);
    }
    window.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  }
  function renderRows(key) {
    const state = states[key], win = windows[key];
    const terms = state.query.toLowerCase().split(/\s+/).filter(x => x && !['help','me','my','to','with','manage'].includes(x));
    const searching = state.query.trim().length > 0;
    if (state.tab === 'browse') {
      win.querySelector('.ri-your-strip').hidden = searching || state.installed.length === 0;
      win.querySelector('.ri-result-title').textContent = searching ? 'Search results' : 'Browse';
    }
    const shown = items.filter(item => (state.tab === 'browse' ? searching || !item.installed || !state.installed.includes(item.id) : state.installed.includes(item.id)) && terms.every(term => `${item.name} ${item.description} ${item.keywords}`.toLowerCase().includes(term)));
    win.querySelector('.ri-list').innerHTML = shown.map(item => {
      const added = state.installed.includes(item.id), off = state.off.includes(item.id);
      const action = !added ? (item.account ? 'Connect' : 'Add') : off ? 'Turn on' : item.ui ? 'Open' : 'Try in chat';
      const primary = added && off && key === 'switches' ? '' : button(action,!added ? 'add' : off ? 'toggle' : 'use',item.id);
      if (state.tab === 'browse') return `<div class="ri-catalog-item"><div class="ri-card-title"><div class="ri-icon">${icon(item.icon)}</div><button type="button" class="cursor-interaction" data-action="settings" data-id="${item.id}">${item.name}</button></div><div class="ri-description">${item.description}</div><div class="ri-card-footer"><span class="ri-note">${added ? off ? 'Off' : 'Added' : `By ${item.publisher}`}</span>${primary}</div></div>`;
      const menu = state.menu === item.id ? `<div class="ri-menu">${button('Settings','settings',item.id)}${key === 'menu' ? button(off ? 'Turn on' : 'Turn off','toggle',item.id) : ''}${button('Remove','remove',item.id)}</div>` : '';
      return `<div class="ri-row"><div class="ri-icon">${icon(item.icon)}</div><div><div class="ri-name"><button type="button" class="cursor-interaction" data-action="settings" data-id="${item.id}">${item.name}</button>${off ? '<span class="ri-off">Off</span>' : added && state.tab === 'browse' ? '<span class="ri-off">Added</span>' : ''}</div><div class="ri-description">${item.description}</div></div><div class="ri-actions">${primary}${added && key === 'switches' ? `<input type="checkbox" class="ri-switch cursor-interaction" aria-label="Enable ${item.name}" data-toggle="${item.id}" ${off ? '' : 'checked'}>` : ''}${added ? `<div class="ri-more"><button type="button" class="ri-btn ri-quiet cursor-interaction" aria-label="Manage ${item.name}" aria-expanded="${state.menu === item.id}" data-action="menu" data-id="${item.id}">${icon('ellipsis')}</button>${menu}</div>` : ''}</div></div>`;
    }).join('') || '<div class="ri-empty">No matching additions.</div>';
    window.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  }
  function toggle(state, id) {
    state.off = state.off.includes(id) ? state.off.filter(value => value !== id) : [...state.off,id];
    state.notice = `${items.find(x => x.id === id).name} turned ${state.off.includes(id) ? 'off. Your setup is kept.' : 'on.'}`;
  }
  hydrate(window.openai?.widgetState);
  root.querySelectorAll('.ri-window').forEach(win => {
    const key = win.dataset.version;
    windows[key] = win;
    win.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const { action, id } = target.dataset, state = states[key], item = items.find(x => x.id === id);
      state.notice = '';
      if (action !== 'menu') state.menu = '';
      if (action === 'yours' || action === 'browse') { state.tab = action; state.query = ''; state.screen = 'list'; }
      else if (action === 'back') state.screen = 'list';
      else if (action === 'menu') state.menu = state.menu === id ? '' : id;
      else if (action === 'toggle') toggle(state,id);
      else if (action === 'use') { if (state.off.includes(id)) { state.notice = 'Turn this on before using it.'; } else { state.selected = id; state.screen = item.ui ? 'app' : 'chat'; } }
      else if (action === 'settings' || action === 'remove') { state.selected = id; state.screen = action; }
      else if (action === 'add' && item.account) { state.selected = id; state.screen = 'connect'; }
      else if (action === 'add' || action === 'finish-add') { if (!state.installed.includes(id)) state.installed.push(id); state.off = state.off.filter(value => value !== id); state.screen = 'list'; state.notice = `${item.name} added to Ri.`; }
      else if (action === 'finish-remove' || action === 'disconnect') { state.installed = state.installed.filter(value => value !== id); state.off = state.off.filter(value => value !== id); state.screen = 'list'; state.notice = `${item.name} ${action === 'disconnect' ? 'disconnected' : 'removed'}.`; }
      render(key); save();
    });
    win.addEventListener('input', event => {
      if (event.target.matches('.ri-search input')) { states[key].query = event.target.value; renderRows(key); save(); }
    });
    win.addEventListener('change', event => {
      const target = event.target, state = states[key];
      if (target.dataset.toggle) { toggle(state,target.dataset.toggle); render(key); save(); }
      if (target.dataset.setting) { state[target.dataset.setting] = target.value; win.querySelector('.ri-status').textContent = 'Saved.'; save(); }
    });
    win.addEventListener('keydown', event => { if (event.key === 'Escape' && states[key].menu) { states[key].menu = ''; renderRows(key); } });
    render(key);
  });
  window.addEventListener('openai:set_globals', event => {
    const snapshot = event.detail?.globals?.widgetState;
    if (snapshot?.privateContent?.version === 2 && JSON.stringify(snapshot.privateContent.states) !== JSON.stringify(states)) {
      hydrate(snapshot); Object.keys(windows).forEach(render);
    }
  });
})();
</script>
