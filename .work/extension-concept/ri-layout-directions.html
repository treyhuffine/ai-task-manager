  @media (max-width: 620px) { #ri-layout-directions .r-content, #ri-layout-directions .r-collection, #ri-layout-directions .r-home-work, #ri-layout-directions .r-app-canvas { padding: 20px 15px; } #ri-layout-directions .r-toolbar { padding: 11px 14px; } #ri-layout-directions .r-toolbar-right { padding-right: 0; } #ri-layout-directions .r-toolbar-right .r-small { display: none; } #ri-layout-directions .r-page-heading { align-items: flex-start; flex-wrap: wrap; } #ri-layout-directions .r-app h1 { font-size: 22px; } #ri-layout-directions .r-spotlights, #ri-layout-directions .r-home-layout, #ri-layout-directions .r-app-view, #ri-layout-directions .r-detail-layout { grid-template-columns: 1fr; } #ri-layout-directions .r-spotlights .r-spotlight:nth-child(2) { display: none; } #ri-layout-directions .r-home-discover, #ri-layout-directions .r-companion { border-left: 0; border-top: 1px solid var(--r-line); } #ri-layout-directions .r-shelf { grid-template-columns: 1fr; gap: 12px; } #ri-layout-directions .r-collection-controls { flex-direction: column; gap: 12px; } #ri-layout-directions .r-collection-controls .r-search { width: 100%; max-width: none; } #ri-layout-directions .r-topnav { padding: 12px; } #ri-layout-directions .r-topnav .r-brand { margin: 0; padding: 0; } #ri-layout-directions .r-top-links { flex: 1; justify-content: flex-start; } #ri-layout-directions .r-topnav .r-nav-text { display: none; } #ri-layout-directions .r-topnav .r-nav-item { padding: 7px; } #ri-layout-directions .r-split { grid-template-columns: 1fr; } #ri-layout-directions .r-owned-pane { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--r-line); } #ri-layout-directions .r-owned-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 2px 8px; } #ri-layout-directions .r-owned-footer { margin-top: 10px; padding-top: 10px; } #ri-layout-directions .r-inspector { grid-column: auto; border-left: 0; } #ri-layout-directions .r-grid { grid-template-columns: 1fr; } #ri-layout-directions .r-card { gap: 8px; } #ri-layout-directions .r-library-row { grid-template-columns: 30px minmax(0,1fr); } #ri-layout-directions .r-row-actions { grid-column: 2; justify-content: flex-end; } #ri-layout-directions .r-chat { padding: 20px 15px; } #ri-layout-directions .r-search input { font-size: 16px; } #ri-layout-directions .r-launchers { grid-template-columns: 1fr; } }

<div id="ri-layout-directions" class="viz-carousel" aria-label="Whole Ri layout directions">
  <section data-variant="Explore hub"><div class="r-stage"><div class="r-app" data-design="hub" aria-label="Explore hub design"></div></div></section>
  <section data-variant="Library beside discovery" hidden><div class="r-stage"><div class="r-app" data-design="split" aria-label="Library beside discovery design"></div></div></section>
  <section data-variant="Everyday home" hidden><div class="r-stage"><div class="r-app" data-design="home" aria-label="Everyday home design"></div></div></section>
  <section data-variant="One collection" hidden><div class="r-stage"><div class="r-app" data-design="collection" aria-label="One collection design"></div></div></section>
</div>
<script>
(() => {
  const root = document.getElementById('ri-layout-directions');
  const items = [
    { id:'finances', name:'Finances', icon:'wallet', type:'app', group:'Everyday', by:'Ri', description:'See where your money goes.', capabilities:['Review spending and accounts','Explore transactions with Ri'], prompt:'Help me understand my spending this month.' },
    { id:'people', name:'People', icon:'contact', type:'app', group:'Everyday', by:'Ri', description:'Keep up with the people you know.', capabilities:['Keep notes on your relationships','Plan your next follow-up'], prompt:'Who should I catch up with this week?' },
    { id:'travel', name:'Travel', icon:'plane', type:'app', group:'Everyday', by:'Ri', description:'Bring your trips and plans together.', capabilities:['Keep an itinerary you can open','Plan and adjust your trip with Ri'], prompt:'Help me plan a weekend in Seattle.' },
    { id:'gmail', name:'Gmail', icon:'mail', type:'connection', group:'Work', by:'Google', description:'Find emails and prepare replies.', capabilities:['Search your connected email','Prepare drafts for you to review'], prompt:'Find the emails I need to reply to.' },
    { id:'calendar', name:'Google Calendar', icon:'calendar-days', type:'connection', group:'Work', by:'Google', description:'Plan around what is on your calendar.', capabilities:['See meetings and availability','Help plan and update your schedule'], prompt:'Help me make room for focused work this week.' },
    { id:'slack', name:'Slack', icon:'messages-square', type:'connection', group:'Work', by:'Slack', description:'Catch up on conversations and decisions.', capabilities:['Find context in your channels','Prepare updates for your team'], prompt:'Catch me up on the decisions from this week.' },
    { id:'proposal', name:'Proposal style', icon:'file-pen-line', type:'skill', group:'Create', by:'You', description:'Write proposals your way.', capabilities:['Use your preferred structure','Keep your tone and examples'], prompt:'Help me write a proposal using my usual style.' },
    { id:'slides', name:'Presentations', icon:'presentation', type:'skill', group:'Create', by:'Ri', description:'Turn your ideas into a clear presentation.', capabilities:['Shape a clear story','Build and refine a presentation'], prompt:'Help me turn these notes into a presentation.' },
    { id:'weekly', name:'Weekly review', icon:'list-checks', type:'skill', group:'Create', by:'Ri', description:'Reflect, wrap up, and choose what is next.', capabilities:['Review the work you finished','Choose priorities for next week'], prompt:'Walk me through my weekly review.' }
  ];
  const keys = ['hub','split','home','collection'];
  const views = ['explore','library','home','chats','tasks','notes','agents','detail','app','chat','connect','create','settings'];
  const windows = {}, state = {}, design = {};
  const defaults = ['finances','people','gmail','proposal'];
  const get = id => items.find(item => item.id === id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ic = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const b = (label,action,id='',extra='') => `<button type="button" class="r-button cursor-interaction ${extra}" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
  const navNames = [['home','house','Home'],['chats','messages-square','Chats'],['tasks','list-todo','Tasks'],['notes','notebook','Notes'],['agents','bot','Agents'],['explore','compass','Explore']];
  function hydrate(snapshot) {
    const saved = snapshot?.privateContent?.version === 3 ? snapshot.privateContent.state : {};
    keys.forEach(key => {
      const prior = saved?.[key] || {};
      state[key] = {
        view: views.includes(prior.view) ? prior.view : key === 'home' ? 'home' : 'explore',
        selected: get(prior.selected) ? prior.selected : key === 'split' ? 'travel' : '',
        panel: prior.panel === 'settings' ? 'settings' : 'overview',
        query: typeof prior.query === 'string' ? prior.query : '',
        group: ['All','Everyday','Work','Create','Added'].includes(prior.group) ? prior.group : 'All',
        catalogAll: prior.catalogAll === true,
        added: Array.isArray(prior.added) ? prior.added.filter(id=>get(id)) : [...defaults],
        off: Array.isArray(prior.off) ? prior.off.filter(id=>get(id)) : [],
        pinned: Array.isArray(prior.pinned) ? prior.pinned.filter(id=>get(id)?.type === 'app') : ['finances','people'],
        menu: '', confirm: '', notice: '', draft: typeof prior.draft === 'string' ? prior.draft : '', sent: false,
        currency: prior.currency || 'USD', access: prior.access || 'All agents',
        instructions: prior.instructions || 'Start with the client goal, then the proposed work, timing, and price.',
        createMode: 'build', tasksDone: Array.isArray(prior.tasksDone) ? prior.tasksDone : []
      };
    });
  }
  function save() {
    const snapshot = {};
    keys.forEach(key => { const {menu,confirm,notice,sent,...persistent}=state[key]; snapshot[key]=persistent; });
    lastSaved = JSON.stringify(snapshot);
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:null,privateContent:{version:3,state:snapshot}}).catch(()=>{});
    return lastSaved;
  }
  let lastSaved = '';
  function persist() { lastSaved = save(); }
  function nav(key,top=false,slim=false) {
    const s=state[key];
    const active = ['explore','library','detail','connect','create'].includes(s.view) ? 'explore' : s.view;
    const links = navNames.map(([id,icon,label])=>`<button type="button" class="r-nav-item cursor-interaction" data-action="nav" data-id="${id}" aria-label="${label}" ${active === id ? 'aria-current="page"' : ''}>${ic(icon)}<span class="r-nav-text">${label}</span></button>`).join('');
    const brand = `<div class="r-brand"><span class="r-brand-mark">ri</span><span class="r-wordmark">Ri</span></div>`;
    if(top) return `<header class="r-topnav">${brand}<nav class="r-top-links" aria-label="Main navigation">${links}</nav><div class="r-avatar" aria-label="Alex">A</div></header>`;
    return `<aside class="r-sidebar ${slim?'r-slim':''}">${brand}${b(`${ic('plus')}<span class="r-nav-text">New chat</span>`,'new-chat','','r-quiet')}<nav aria-label="Main navigation">${links}</nav>${key==='hub'?`<div class="r-nav-label">EXPLORE</div>${b('Your library','nav','library','r-nav-item')}${b('Add your own','nav','create','r-nav-item')}`:''}<div class="r-nav-label">PINNED</div>${s.pinned.filter(id=>s.added.includes(id)).map(id=>`<button type="button" class="r-nav-item cursor-interaction" data-action="open" data-id="${id}" aria-label="Open ${get(id).name}" ${s.view==='app'&&s.selected===id?'aria-current="page"':''}>${ic(get(id).icon)}<span class="r-nav-text">${get(id).name}</span></button>`).join('')}<div class="r-sidebar-foot">${b(`${ic('settings-2')}<span class="r-nav-text">Settings</span>`,'nav','settings','r-nav-item')}<div class="r-person"><span class="r-avatar">A</span><span class="r-person-name">Alex</span></div></div></aside>`;
  }
  function toolbar(key) {
    const s=state[key];
    const title = s.view==='app' ? get(s.selected)?.name : ({explore:'Explore',library:'Your library',home:'Home',detail:'Explore',chat:'New chat',connect:'Connect an account',create:'Add your own'})[s.view] || s.view.charAt(0).toUpperCase()+s.view.slice(1);
    return `<div class="r-toolbar"><span>${esc(title)}</span><div class="r-toolbar-right"><span class="r-small r-muted">Design preview</span>${b(ic('plus'),'new-chat','','r-square r-quiet').replace('<button ','<button aria-label="New chat" ')}</div></div>`;
  }
  function search(key,placeholder='Search by name or what you want to do') {
    return `<label class="r-search">${ic('search')}<input data-field="query" aria-label="Search additions" placeholder="${placeholder}" value="${esc(state[key].query)}"></label>`;
  }
  function filters(key,added=false) {
    const labels=added?['All','Added']:['All','Everyday','Work','Create'];
    return `<div class="r-filters" aria-label="Browse filters">${labels.map(label=>`<button type="button" class="r-filter cursor-interaction" data-action="filter" data-id="${label}" aria-pressed="${state[key].group===label}">${label==='Added'?`Added (${state[key].added.length})`:label}</button>`).join('')}</div>`;
  }
  function match(key,item) {
    const s=state[key],terms=s.query.toLowerCase().split(/\s+/).filter(x=>x&&!['help','me','my','to','with','manage'].includes(x));
    return terms.every(term=>`${item.name} ${item.description} ${item.group} ${item.type} ${item.id==='finances'?'money budget spending':''}`.toLowerCase().includes(term)) && (s.group==='All'||s.group==='Added'&&s.added.includes(item.id)||s.group===item.group);
  }
  function primary(key,item,extra='') {
    const s=state[key],added=s.added.includes(item.id),off=s.off.includes(item.id);
    return b(!added?(item.type==='connection'?'Connect':'Add to Ri'):off?'Turn on':item.type==='app'?'Open':'Try in chat',!added?'add':off?'toggle':item.type==='app'?'open':'use',item.id,extra);
  }
  function menu(key,item) {
    const s=state[key];
    return `<div class="r-more">${b(ic('ellipsis'),'menu',item.id,'r-square r-quiet').replace('<button ',`<button aria-label="Manage ${item.name}" aria-expanded="${s.menu===item.id}" `)}${s.menu===item.id?`<div class="r-menu">${b('Settings','manage',item.id)}${b(s.off.includes(item.id)?'Turn on':'Turn off','toggle',item.id)}${b('Remove','remove',item.id)}</div>`:''}</div>`;
  }
  function card(key,item) {
    const s=state[key],added=s.added.includes(item.id);
    return `<article class="r-card" data-item="${item.id}"><div class="r-card-head"><div class="r-icon">${ic(item.icon)}</div><button type="button" class="r-title-button cursor-interaction" data-action="select" data-id="${item.id}">${item.name}</button></div><div class="r-description">${item.description}</div><div class="r-card-foot"><span class="r-state">${added?s.off.includes(item.id)?'Off':'Added':`By ${item.by}`}</span><span class="r-row-actions">${primary(key,item)}${added?menu(key,item):''}</span></div></article>`;
  }
  function travelPreview() { return `<div class="r-mini-trip"><div><span class="r-muted">NEXT TRIP</span><strong>Seattle</strong></div>${ic('arrow-right')}<div><span class="r-muted">3 DAYS</span><div>Plans in one place</div></div></div>`; }
  function spotlight(key,id) {
    const item=get(id),travel=id==='travel';
    return `<div class="r-spotlight ${travel?'':'r-warm'}"><div class="r-card-head">${ic(item.icon)}<button class="r-title-button cursor-interaction" type="button" data-action="select" data-id="${id}">${item.name}</button></div>${travel?travelPreview():`<div class="r-step-preview"><span>${ic('check')}Review</span><span>${ic('list-todo')}Choose</span><span>${ic('arrow-right')}Begin</span></div>`}<div class="r-card-foot"><span class="r-description">${travel?'A home for your next trip.':'Make space for what is next.'}</span>${primary(key,item)}</div></div>`;
  }
  function library(key) {
    const s=state[key],shown=items.filter(item=>s.added.includes(item.id)&&match(key,item));
    return `<div class="r-content"><div class="r-page-heading"><div><h1>Your library</h1><p>${s.added.length} additions, ready when you need them.</p></div>${b(`${ic('compass')} Browse`,'nav','explore')}</div>${search(key,'Search your additions')}<div class="r-library-rows">${shown.map(item=>`<div class="r-library-row"><div class="r-icon">${ic(item.icon)}</div><div><button class="r-title-button cursor-interaction" type="button" data-action="manage" data-id="${item.id}">${item.name}</button><div class="r-description r-small r-muted">${s.off.includes(item.id)?'Off':item.description}</div></div><div class="r-row-actions">${primary(key,item)}${menu(key,item)}</div></div>`).join('')||'<div class="r-empty">No matching additions.</div>'}</div></div>`;
  }
  function hub(key) {
    const s=state[key],featured=!s.query&&s.group==='All'&&!s.catalogAll;
    const shown=items.filter(item=>match(key,item)&&(!featured||!['travel','weekly'].includes(item.id))).slice(0,featured?6:20);
    return `<div class="r-content"><div class="r-page-heading"><div><h1>Discover more for your Ri</h1><p>Bring your tools together. Find new ways to work.</p></div>${b('Add your own','nav','create')}</div>${search(key)}${featured?`<div class="r-spotlights">${spotlight(key,'travel')}${spotlight(key,'weekly')}</div>`:''}<div class="r-section-head"><h2>Explore the collection</h2>${featured?b('Browse all','catalog-all','','r-quiet'):key==='home'?b(`Yours (${s.added.length})`,'nav','library','r-quiet'):''}</div>${filters(key)}<div class="r-grid">${shown.map(item=>card(key,item)).join('')||'<div class="r-empty">No matching additions.</div>'}</div></div>`;
  }
  function preview(item) {
    if(item.id==='travel') return `<div class="r-preview">${travelPreview()}<div class="r-preview-line"><span>Friday</span><span>Arrive and settle in</span></div><div class="r-preview-line"><span>Saturday</span><span>Explore the city</span></div><div class="r-preview-line"><span>Sunday</span><span>One last coffee</span></div></div>`;
    if(item.id==='finances') return `<div class="r-preview"><h3>Your spending, in view</h3><div class="r-preview-line"><span>Groceries</span><span>$82.40</span></div><div class="r-preview-line"><span>Coffee</span><span>$6.00</span></div></div>`;
    if(item.id==='people') return `<div class="r-preview"><h3>People to catch up with</h3><div class="r-preview-line"><span>Sam</span><span>Follow up this week</span></div><div class="r-preview-line"><span>Jordan</span><span>Last spoke 2 weeks ago</span></div></div>`;
    return `<div class="r-preview"><div class="r-small r-muted">TRY ASKING RI</div><p style="margin-top:8px">${item.prompt}</p></div>`;
  }
  function detail(key,compact=false) {
    const s=state[key],item=get(s.selected)||get('travel'),added=s.added.includes(item.id),settings=s.panel==='settings';
    let controls='';
    if(s.confirm===item.id) controls=`<div class="r-confirm"><h3>Remove ${item.name}?</h3><p class="r-small r-muted">Your saved data stays.</p><div class="r-row-actions">${b('Keep it','cancel-remove')}${b('Remove','confirm-remove',item.id)}</div></div>`;
    else if(settings&&added) controls=`<label class="r-setting"><span>Enabled in Ri<div class="r-description">Turn off to pause use and keep your setup.</div></span><input class="r-switch cursor-interaction" type="checkbox" data-toggle="${item.id}" ${s.off.includes(item.id)?'':'checked'}></label><label class="r-form">Available to<select class="r-field" data-setting="access">${['All agents','Personal agent','Work agent'].map(v=>`<option ${s.access===v?'selected':''}>${v}</option>`).join('')}</select></label>${item.type==='connection'?`<div class="r-setting"><span>Account<div class="r-small r-muted">alex@example.com</div></span>${b('Disconnect','remove',item.id,'r-quiet')}</div>`:''}${item.type==='app'?`<label class="r-setting"><span>Pin in navigation</span><input class="r-switch cursor-interaction" type="checkbox" data-pin="${item.id}" ${s.pinned.includes(item.id)?'checked':''}></label>`:''}${item.id==='finances'?`<label class="r-form">Currency<select class="r-field" data-setting="currency">${['USD','EUR','GBP'].map(v=>`<option ${s.currency===v?'selected':''}>${v}</option>`).join('')}</select></label>`:''}${item.type==='skill'?`<label class="r-form">Instructions<textarea class="r-field" data-setting="instructions">${esc(s.instructions)}</textarea></label>`:''}<div class="r-detail-actions">${b('Remove','remove',item.id,'r-quiet')}</div>`;
    else controls=`<div class="r-what-list">${item.capabilities.map(text=>`<div>${ic('check')}<span>${text}</span></div>`).join('')}</div><div class="r-setting"><span class="r-small r-muted">${item.type==='connection'?'Connect an account to get started.':item.type==='app'?'Open in Ri or use in chat.':'Available when you work with Ri.'}</span></div>`;
    const main=`<div class="r-detail"><div class="r-detail-head"><div class="r-icon">${ic(item.icon)}</div><div><h2>${item.name}</h2><div class="r-small r-muted">By ${item.by}${added?' · Added':''}</div></div></div><p class="r-description">${item.description}</p><div class="r-detail-actions">${primary(key,item,'r-primary')}${added?b(settings?'Overview':'Settings',settings?'select':'manage',item.id):''}</div>${compact&&!settings?preview(item):''}${controls}</div>`;
    return compact?main:`<div class="r-detail-layout">${main}<div>${preview(item)}</div></div>`;
  }
  function split(key) {
    const s=state[key],added=items.filter(item=>s.added.includes(item.id));
    const shown=items.filter(item=>match(key,item)).sort((a,b)=>Number(s.added.includes(a.id))-Number(s.added.includes(b.id)));
    return `<div class="r-split"><aside class="r-owned-pane"><div class="r-section-head"><h2>Yours</h2><span class="r-small r-muted">${added.length}</span></div><div class="r-owned-list">${added.map(item=>`<div class="r-owned-item">${ic(item.icon)}<button type="button" class="r-title-button cursor-interaction" data-action="${s.off.includes(item.id)?'manage':item.type==='app'?'open':'use'}" data-id="${item.id}">${item.name}${s.off.includes(item.id)?'<div class="r-small r-muted">Off</div>':''}</button>${menu(key,item)}</div>`).join('')}</div><div class="r-owned-footer">${b(`${ic('plus')} Add your own`,'nav','create','r-quiet')}</div></aside><div class="r-catalog-pane"><div class="r-section-head"><h1>Discover</h1></div>${search(key,'Search additions')}${filters(key)}${shown.map(item=>`<button class="r-select-row cursor-interaction" type="button" data-action="select" data-id="${item.id}" aria-pressed="${s.selected===item.id}"><span class="r-icon">${ic(item.icon)}</span><span><span>${item.name}</span><div class="r-description">${item.description}</div>${s.added.includes(item.id)?'<span class="r-small r-muted">Added</span>':''}</span>${ic('chevron-right')}</button>`).join('')||'<div class="r-empty">No matches.</div>'}</div><aside class="r-inspector" aria-label="Selected addition">${detail(key,true)}</aside></div>`;
  }
  function tasks(key) {
    return ['Review the website copy','Prepare the project proposal','Plan next week'].map((text,i)=>`<label class="r-task"><input type="checkbox" data-task="${i}" ${state[key].tasksDone.includes(i)?'checked':''}><span>${text}</span></label>`).join('');
  }
  function home(key) {
    const s=state[key];
    return `<div class="r-home-layout"><section class="r-home-work"><h1>Your day</h1><p class="r-description r-muted" style="margin-top:7px">A little space to get things done.</p><div class="r-composer"><textarea data-field="draft" aria-label="Chat draft" placeholder="What would you like to work on?">${esc(s.draft)}</textarea><div class="r-composer-foot"><span class="r-small r-muted">Ask Ri</span>${b(ic('arrow-up'),'send','','r-primary r-square').replace('<button ','<button aria-label="Start chat" ')}</div></div><div class="r-section-head"><h2>Ready to use</h2>${b('Manage','nav','library','r-quiet')}</div><div class="r-launchers">${items.filter(item=>s.added.includes(item.id)).slice(0,4).map(item=>`<button class="r-launcher cursor-interaction" type="button" data-action="${s.off.includes(item.id)?'manage':item.type==='app'?'open':'use'}" data-id="${item.id}"><span class="r-icon">${ic(item.icon)}</span><span>${item.name}<div class="r-muted">${s.off.includes(item.id)?'Off':item.type==='app'?'Open':'Use with Ri'}</div></span></button>`).join('')}</div><div class="r-section-head"><h2>Today</h2>${b('All tasks','nav','tasks','r-quiet')}</div>${tasks(key)}<div class="r-section-head" style="margin-top:26px"><h2>Pick up where you left off</h2></div>${b(`${ic('message-circle')} Website launch plan`,'new-chat','','r-quiet')}</section><aside class="r-home-discover"><div class="r-section-head"><h2>Discover</h2>${b('Browse all','nav','explore','r-quiet')}</div><p class="r-description r-muted">More ways to make Ri yours.</p>${search(key,'Find something useful')}${s.query?items.filter(item=>match(key,item)).map(item=>card(key,item)).join(''):`${spotlight(key,'travel')}${card(key,get('calendar'))}${card(key,get('weekly'))}`}</aside></div>`;
  }
  function collection(key) {
    const s=state[key];
    const groups=[[['finances','calendar','weekly'],'Everyday life','Money, time, and what comes next.'],[['people','gmail','slack'],'Stay connected','People and the conversations around them.'],[['travel','proposal','slides'],'Plan and create','Turn ideas into something you can use.']];
    return `<div class="r-collection"><div class="r-page-heading"><div><h1>Make Ri yours</h1><p>Everything you use, and everything you can add.</p></div>${b(`${ic('plus')} Add your own`,'nav','create')}</div><div class="r-collection-controls">${filters(key,true)}${search(key,'Find an addition')}</div>${s.selected?`<div class="r-inline-detail">${b(`${ic('x')} Close details`,'close-detail','','r-quiet')}${detail(key)}</div>`:''}${groups.map(([ids,title,description])=>{const shown=ids.map(get).filter(item=>match(key,item));return shown.length?`<section class="r-shelf"><div class="r-shelf-label"><h2>${title}</h2><p class="r-description">${description}</p></div><div class="r-grid">${shown.map(item=>card(key,item)).join('')}</div></section>`:'';}).join('')||'<div class="r-empty">No matching additions.</div>'}</div>`;
  }
  function appView(key) {
    const s=state[key],item=get(s.selected)||get('finances');
    let canvas='';
    if(item.id==='finances') canvas=`<div class="r-finance-summary"><div class="r-small r-muted">SPENDING THIS MONTH</div><div class="r-value">$1,248.40</div>${[['Food',58,'$724'],['Travel',27,'$337'],['Other',15,'$187']].map(([name,width,value])=>`<div class="r-chart-row"><span>${name}</span><div class="r-bar"><span style="width:${width}%"></span></div><span>${value}</span></div>`).join('')}</div><h2>Recent transactions</h2><div class="r-preview-line"><span>Grocery store</span><span>$82.40</span></div><div class="r-preview-line"><span>Coffee</span><span>$6.00</span></div><div class="r-preview-line"><span>Train ticket</span><span>$24.00</span></div>`;
    else if(item.id==='people') canvas=`<div class="r-search" style="margin-top:24px">${ic('search')}<input aria-label="Search people" placeholder="Find a person" data-field="people-search"></div>${['Sam Chen','Jordan Lee','Avery Park'].map(name=>`<div class="r-library-row"><span class="r-avatar">${name.split(' ').map(x=>x[0]).join('')}</span><div>${name}<div class="r-small r-muted">Notes, conversations, and follow-ups</div></div>${b('View notes','sample-note',name,'r-quiet')}</div>`).join('')}`;
    else canvas=`${preview(item)}<h2>Trip notes</h2><p class="r-muted" style="margin-top:12px">A few places to explore, a good coffee stop, and room to change the plan.</p>`;
    return `<div class="r-app-view"><div class="r-app-canvas"><div class="r-page-heading"><div><h1>${item.name}</h1><p>Example data</p></div>${b(`${ic('settings-2')} Settings`,'manage',item.id)}</div>${canvas}</div><aside class="r-companion"><div class="r-section-head"><h2>Ask Ri</h2>${ic('message-circle-more')}</div><p class="r-description r-muted">Work with ${item.name.toLowerCase()} here.</p><div class="r-message">${item.prompt}</div><div class="r-composer"><textarea data-field="draft" aria-label="Chat draft" placeholder="Ask or make a change">${esc(s.draft)}</textarea><div class="r-composer-foot"><span class="r-small r-muted">${item.name}</span>${b(ic('arrow-up'),'send','','r-square r-primary').replace('<button ','<button aria-label="Send draft" ')}</div></div></aside></div>`;
  }
  function chat(key) {
    const s=state[key],item=get(s.selected);
    return `<div class="r-chat"><h1>${s.sent?'Chat':'Start a conversation'}</h1>${item?`<div class="r-small r-muted" style="margin-top:8px">Using ${item.name}</div>`:''}${s.sent?`<div class="r-message r-user">${esc(s.draft||'Help me get started.')}</div><div class="r-message">Let’s work through it together. What would you like to focus on first?</div>`:'<p class="r-muted" style="margin-top:12px">Your addition is ready to use here.</p>'}<div class="r-composer"><textarea data-field="draft" aria-label="Chat draft" placeholder="Ask Ri">${esc(s.sent?'':s.draft)}</textarea><div class="r-composer-foot">${b('Choose additions','nav','library','r-quiet')}${b(ic('arrow-up'),'send','','r-primary r-square').replace('<button ','<button aria-label="Send draft" ')}</div></div></div>`;
  }
  function create(key) {
    const s=state[key];
    return `<div class="r-content"><div class="r-page-heading"><div><h1>Add your own</h1><p>Build something useful or bring something you already have.</p></div></div><div class="r-filters">${[['build','Build with Ri'],['import','Import'],['server','Connect MCP']].map(([id,label])=>`<button type="button" class="r-filter cursor-interaction" data-action="create-mode" data-id="${id}" aria-pressed="${s.createMode===id}">${label}</button>`).join('')}</div>${s.createMode==='build'?`<label class="r-form">What would you like Ri to do?<textarea class="r-field" data-field="draft" aria-label="Build request" placeholder="A place to track the equipment I lend to people">${esc(s.draft)}</textarea></label><div class="r-detail-actions">${b('Work on this with Ri','send','','r-primary')}</div>`:s.createMode==='import'?`<label class="r-form">Choose an app or skill package<input class="r-field" type="file" data-import></label><div class="r-small r-muted" style="margin-top:12px">Review what it adds before installing.</div>`:`<label class="r-form">Server URL<input class="r-field" type="url" data-field="server" placeholder="https://example.com/mcp"></label><div class="r-detail-actions">${b('Prepare connection','prepare-server','','r-primary')}</div>`}</div>`;
  }
  function generic(key) {
    const s=state[key];
    if(s.view==='tasks') return `<div class="r-content"><h1>Tasks</h1><div style="margin-top:22px">${tasks(key)}</div></div>`;
    if(s.view==='notes') return `<div class="r-content"><h1>Notes</h1>${['Website ideas','Project notes','Places to visit'].map(name=>`<div class="r-library-row"><span class="r-icon">${ic('file-text')}</span><span>${name}</span>${b('Open','sample-note',name)}</div>`).join('')}</div>`;
    if(s.view==='agents') return `<div class="r-content"><h1>Agents</h1>${['Personal','Work'].map(name=>`<div class="r-library-row"><span class="r-avatar">${name[0]}</span><div>${name}<div class="r-small r-muted">Your instructions and available tools</div></div>${b('Chat','new-chat')}</div>`).join('')}</div>`;
    if(s.view==='settings') return `<div class="r-content"><h1>Settings</h1><div class="r-setting"><span>Appearance</span><select class="r-field" style="width:auto" aria-label="Appearance"><option>System</option><option>Light</option><option>Dark</option></select></div><div class="r-setting"><span>Your additions</span>${b('Manage library','nav','library')}</div></div>`;
    return `<div class="r-content"><div class="r-page-heading"><h1>Chats</h1>${b('New chat','new-chat','','r-primary')}</div>${['Website launch plan','Prepare a proposal','Plan the weekend'].map(name=>`<div class="r-library-row"><span class="r-icon">${ic('message-circle')}</span><span>${name}</span>${b('Open','new-chat')}</div>`).join('')}</div>`;
  }
  function content(key) {
    const s=state[key];
    if(s.view==='explore') return key==='split'?split(key):key==='collection'?collection(key):hub(key);
    if(s.view==='library') return library(key);
    if(s.view==='home') return home(key);
    if(s.view==='app') return appView(key);
    if(s.view==='chat') return chat(key);
    if(s.view==='create') return create(key);
    if(s.view==='detail') return `<div class="r-content">${b('← Back to explore','nav','explore','r-quiet')}${detail(key)}</div>`;
    if(s.view==='connect') { const item=get(s.selected); return `<div class="r-content"><div class="r-page-heading"><div><h1>Connect ${item.name}</h1><p>Choose the account you want Ri to use.</p></div></div><div class="r-detail-layout"><div><div class="r-preview"><div class="r-small r-muted">EXAMPLE ACCOUNT</div><p style="margin-top:6px">alex@example.com</p></div><div class="r-what-list">${item.capabilities.map(text=>`<div>${ic('check')}<span>${text}</span></div>`).join('')}</div>${b('Connect account','finish-add',item.id,'r-primary')}</div></div></div>`; }
    return generic(key);
  }
  function render(key,focus) {
    const win=windows[key],s=state[key],top=key==='split'||key==='collection';
    const feedback=`<div class="r-feedback" role="status">${esc(s.notice)}</div>`;
    win.innerHTML=top?`${nav(key,true)}<div class="r-main">${content(key)}${feedback}</div>`:`<div class="r-body">${nav(key,false,key==='home')}<div class="r-main">${toolbar(key)}${content(key)}${feedback}</div></div>`;
    win.dataset.density=design[key].density;
    win.dataset.descriptions=String(design[key].descriptions);
    window.lucide?.createIcons({attrs:{width:16,height:16}});
    if(focus) { const field=win.querySelector(`[data-field="${focus.field}"]`); if(field) { field.focus(); if(typeof field.setSelectionRange==='function') field.setSelectionRange(focus.start,focus.end); } }
  }
  function select(key,id,settings=false) {
    const s=state[key]; s.selected=id; s.panel=settings?'settings':'overview'; s.menu='';
    if(!(['split','collection'].includes(key)&&s.view==='explore')) s.view='detail';
  }
  function handle(key,target) {
    const s=state[key],{action,id}=target.dataset,item=get(id);
    s.notice=''; if(action!=='menu') s.menu='';
    if(action==='nav') { s.view=id; s.query=''; s.group='All'; s.catalogAll=false; s.confirm=''; s.selected=key==='split'&&id==='explore'?'travel':''; }
    else if(action==='new-chat') { s.view='chat'; s.selected=''; s.draft=''; s.sent=false; }
    else if(action==='filter') { s.group=id; }
    else if(action==='catalog-all') { s.catalogAll=true; s.query=''; s.group='All'; }
    else if(action==='select'||action==='manage') select(key,id,action==='manage');
    else if(action==='close-detail') { s.selected=''; s.confirm=''; }
    else if(action==='menu') s.menu=s.menu===id?'':id;
    else if(action==='toggle') { s.off=s.off.includes(id)?s.off.filter(x=>x!==id):[...s.off,id]; s.notice=`${item.name} turned ${s.off.includes(id)?'off. Your setup is kept.':'on.'}`; }
    else if(action==='open'||action==='use') { if(!s.added.includes(id)||s.off.includes(id)) select(key,id,true); else { s.selected=id; s.view=action==='open'?'app':'chat'; s.draft=action==='use'?item.prompt:''; s.sent=false; } }
    else if(action==='add'&&item.type==='connection') { s.selected=id; s.view='connect'; }
    else if(action==='add'||action==='finish-add') { if(!s.added.includes(id)) s.added.push(id); s.off=s.off.filter(x=>x!==id); s.notice=`${item.name} is ready to use.`; if(s.view==='connect') { s.view='explore'; s.selected=key==='collection'?'':id; } }
    else if(action==='remove') { select(key,id,true); s.confirm=id; }
    else if(action==='cancel-remove') s.confirm='';
    else if(action==='confirm-remove') { s.added=s.added.filter(x=>x!==id); s.off=s.off.filter(x=>x!==id); s.pinned=s.pinned.filter(x=>x!==id); s.confirm=''; s.notice=`${item.name} removed. Saved data is kept.`; s.panel='overview'; }
    else if(action==='send') { s.view='chat'; s.sent=true; if(!s.draft) s.draft='Help me get started.'; }
    else if(action==='create-mode') s.createMode=id;
    else if(action==='prepare-server') { s.view='chat'; s.draft=`Help me review and connect this MCP server: ${s.server||'my server URL'}`; s.sent=false; }
    else if(action==='sample-note') { s.view='chat'; s.selected=''; s.draft=`Help me work with my notes about ${id}.`; s.sent=false; }
    render(key); persist();
  }
  hydrate(window.openai?.widgetState);
  root.querySelectorAll('.r-app').forEach(win=>{
    const key=win.dataset.design; windows[key]=win; design[key]={density:'Comfortable',descriptions:true};
    win.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target)handle(key,target);});
    win.addEventListener('input',event=>{
      const field=event.target.dataset.field;
      if(field==='query') { state[key].query=event.target.value; render(key,{field,start:event.target.selectionStart,end:event.target.selectionEnd}); persist(); }
      else if(['draft','server'].includes(field)) { state[key][field]=event.target.value; persist(); }
      else if(field==='people-search') { win.querySelectorAll('.r-app-canvas .r-library-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(event.target.value.toLowerCase())); }
    });
    win.addEventListener('change',event=>{
      const el=event.target,s=state[key];
      if(el.dataset.toggle) { handle(key,{dataset:{action:'toggle',id:el.dataset.toggle}}); return; }
      if(el.dataset.pin) { const id=el.dataset.pin; s.pinned=el.checked?[...new Set([...s.pinned,id])]:s.pinned.filter(x=>x!==id); s.notice='Navigation updated.'; render(key); }
      if(el.dataset.setting) { s[el.dataset.setting]=el.value; s.notice='Saved.'; win.querySelector('.r-feedback').textContent='Saved.'; }
      if(el.dataset.task!==undefined) { const id=Number(el.dataset.task); s.tasksDone=el.checked?[...new Set([...s.tasksDone,id])]:s.tasksDone.filter(x=>x!==id); }
      if(el.hasAttribute('data-import')) { s.notice=el.files?.[0]?`${el.files[0].name} selected for review. No changes installed.`:''; win.querySelector('.r-feedback').textContent=s.notice; }
      persist();
    });
    win.addEventListener('keydown',event=>{if(event.key==='Escape'&&state[key].menu){state[key].menu='';render(key);}});
    render(key);
    if(globalThis.Tweak) { const tweak=new Tweak({container:win,onChange:()=>{win.dataset.density=design[key].density;win.dataset.descriptions=String(design[key].descriptions);}}); tweak.addSelect(design[key],'density',{label:'Spacing',options:['Comfortable','Compact']}); tweak.addToggle(design[key],'descriptions',{label:'Show descriptions'}); }
  });
  window.addEventListener('openai:set_globals',event=>{
    const snapshot=event.detail?.globals?.widgetState;
    if(snapshot?.privateContent?.version===3&&JSON.stringify(snapshot.privateContent.state)!==lastSaved) { hydrate(snapshot); keys.forEach(key=>render(key)); }
  });
  let lastWidth=0;
  const measure=()=>{
    const width=root.clientWidth;
    if(!width||width===lastWidth)return;
    lastWidth=width;
    const sections=Array.from(root.children).filter(el=>el.matches('section[data-variant]'));
    let height=0;
    sections.forEach(section=>{const hidden=section.hidden;section.hidden=false;const win=section.querySelector('.r-app');win.style.minHeight='';height=Math.max(height,win.scrollHeight);section.hidden=hidden;});
    sections.forEach(section=>{section.querySelector('.r-stage').style.minHeight=`${height}px`;section.querySelector('.r-app').style.minHeight=`${height}px`;});
  };
  new ResizeObserver(measure).observe(root);
  requestAnimationFrame(measure);
})();
</script>
