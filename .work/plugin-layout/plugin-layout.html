<div id="ri-plugin-layout" class="viz-carousel viz-dotted-background" aria-label="Plugins layout designs">
  <section data-variant="Three destinations" aria-label="Three destinations layout">
    <div class="ri-stage">
      <div class="ri-window" data-design="destinations" aria-label="Plugins settings with three destinations">
        <header class="ri-header"><h2>Plugins</h2><p>Give your agents access and ways of working.</p></header>
        <nav class="ri-tabs" role="tablist" aria-label="Plugin destinations">
          <button type="button" role="tab" id="ri-connectors-tab" aria-controls="ri-connectors-panel" aria-selected="true" data-tab="connectors">Connectors</button>
          <button type="button" role="tab" id="ri-skills-tab" aria-controls="ri-skills-panel" aria-selected="false" data-tab="skills">Skills</button>
          <button type="button" role="tab" id="ri-mcp-tab" aria-controls="ri-mcp-panel" aria-selected="false" data-tab="mcp">MCP servers</button>
        </nav>
        <div id="ri-connectors-panel" class="ri-panel" role="tabpanel" aria-labelledby="ri-connectors-tab">
          <div class="ri-toolbar"><div><h3>Connectors</h3><p>Connect services you use.</p></div><button type="button" class="ri-button ri-primary" data-open="connect"><i data-lucide="plus" aria-hidden="true"></i>Connect a service</button></div>
          <div class="ri-list">
            <button type="button" class="ri-item" data-open="gmail"><span class="ri-icon"><i data-lucide="mail" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Gmail</strong><small>Email and drafts</small></span><span class="ri-status">Connected</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="ri-item" data-open="slack"><span class="ri-icon"><i data-lucide="message-square" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Slack</strong><small>Messages and channels</small></span><span class="ri-status">Connected</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
          </div>
          <h3 class="ri-section-label">Available</h3>
          <div class="ri-list ri-available">
            <button type="button" class="ri-item" data-open="notion"><span class="ri-icon"><i data-lucide="book-open" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Notion</strong><small>Pages and documents</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="ri-item" data-open="github"><span class="ri-icon"><i data-lucide="git-branch" aria-hidden="true"></i></span><span class="ri-item-text"><strong>GitHub</strong><small>Repositories and pull requests</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
          </div>
        </div>
        <div id="ri-skills-panel" class="ri-panel" role="tabpanel" aria-labelledby="ri-skills-tab" hidden>
          <div class="ri-toolbar"><div><h3>Skills</h3><p>Teach agents a way of working.</p></div><div class="ri-actions"><button type="button" class="ri-button" data-open="build"><i data-lucide="pencil" aria-hidden="true"></i>Build skill</button><button type="button" class="ri-button ri-primary" data-open="skill"><i data-lucide="plus" aria-hidden="true"></i>Add skill</button></div></div>
          <div class="ri-list">
            <button type="button" class="ri-item" data-open="review"><span class="ri-icon"><i data-lucide="scroll-text" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Review a pull request</strong><small>Check changes and leave clear feedback</small></span><span class="ri-status">Installed</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="ri-item" data-open="notes"><span class="ri-icon"><i data-lucide="scroll-text" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Meeting notes</strong><small>Turn discussion into decisions and follow-ups</small></span><span class="ri-status">Draft</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
          </div>
        </div>
        <div id="ri-mcp-panel" class="ri-panel" role="tabpanel" aria-labelledby="ri-mcp-tab" hidden>
          <div class="ri-toolbar"><div><h3>MCP servers</h3><p>Connect a server by URL.</p></div><button type="button" class="ri-button ri-primary" data-open="mcp"><i data-lucide="plus" aria-hidden="true"></i>Add MCP server</button></div>
          <div class="ri-list"><button type="button" class="ri-item" data-open="research"><span class="ri-icon"><i data-lucide="server" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Research tools</strong><small>research.example.com</small></span><span class="ri-status">Connected</span><i data-lucide="chevron-right" aria-hidden="true"></i></button></div>
          <div class="ri-preferences"><label for="ri-default-policy">Default permissions</label><select id="ri-default-policy"><option>Ask before writes</option><option>Always allow</option><option>Ask every time</option></select></div>
        </div>
        <div class="ri-flow" hidden aria-live="polite"></div>
      </div>
    </div>
  </section>
  <section data-variant="One library" aria-label="One library layout" hidden>
    <div class="ri-stage">
      <div class="ri-window" data-design="library" aria-label="Plugins settings with a shared library">
        <header class="ri-header ri-toolbar"><div><h2>Plugins</h2><p>Give your agents access and ways of working.</p></div><button type="button" class="ri-button ri-primary" data-open="add"><i data-lucide="plus" aria-hidden="true"></i>Add</button></header>
        <div class="ri-panel">
          <div class="ri-toolbar"><h3>Your plugins</h3></div>
          <div class="ri-list">
            <button type="button" class="ri-item" data-open="gmail"><span class="ri-icon"><i data-lucide="mail" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Gmail</strong><small>Connector</small></span><span class="ri-status">Connected</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="ri-item" data-open="review"><span class="ri-icon"><i data-lucide="scroll-text" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Review a pull request</strong><small>Skill</small></span><span class="ri-status">Installed</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="ri-item" data-open="research"><span class="ri-icon"><i data-lucide="server" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Research tools</strong><small>MCP server</small></span><span class="ri-status">Connected</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="ri-item" data-open="slack"><span class="ri-icon"><i data-lucide="message-square" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Slack</strong><small>Connector</small></span><span class="ri-status">Connected</span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="ri-flow" hidden aria-live="polite"></div>
      </div>
    </div>
  </section>
</div>
<style>
#ri-plugin-layout { --ri-bg:light-dark(#fafafa,#19191c); --ri-fg:light-dark(#202024,#efeff1); --ri-sub:light-dark(#65656f,#a0a0aa); --ri-line:light-dark(#dedee3,#34343b); --ri-hover:light-dark(#f0f0f3,#222227); --ri-solid:light-dark(#242428,#ededf0); --ri-on-solid:light-dark(#fafafa,#202024); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
#ri-plugin-layout .ri-stage { min-height:725px; padding:18px 6px; box-sizing:border-box; }
#ri-plugin-layout .ri-window { background:var(--ri-bg); color:var(--ri-fg); border:1px solid var(--ri-line); border-radius:18px; min-height:645px; overflow:hidden; }
#ri-plugin-layout .ri-header { padding:23px 23px 19px; border-bottom:1px solid var(--ri-line); }
#ri-plugin-layout h2 { font-size:18px; line-height:1.4; font-weight:500; margin:0; }
#ri-plugin-layout h3 { font-size:14px; line-height:1.4; font-weight:500; margin:0; }
#ri-plugin-layout p { margin:5px 0 0; font-size:12px; line-height:1.6; color:var(--ri-sub); }
#ri-plugin-layout .ri-tabs { display:flex; flex-wrap:wrap; gap:22px; padding:0 23px; border-bottom:1px solid var(--ri-line); }
#ri-plugin-layout button { font-family:inherit; cursor:var(--cursor-interaction,pointer); }
#ri-plugin-layout .ri-tabs button { background:transparent; color:var(--ri-sub); border:0; border-bottom:2px solid transparent; padding:16px 0 12px; font-size:13px; line-height:1.4; }
#ri-plugin-layout .ri-tabs button[aria-selected=true] { color:var(--ri-fg); border-bottom-color:var(--ri-fg); }
#ri-plugin-layout .ri-panel,#ri-plugin-layout .ri-flow { padding:23px; }
#ri-plugin-layout .ri-toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; }
#ri-plugin-layout .ri-actions { display:flex; flex-wrap:wrap; gap:8px; }
#ri-plugin-layout .ri-button { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--ri-bg); color:var(--ri-fg); border:1px solid var(--ri-line); border-radius:7px; padding:8px 11px; font-size:12px; line-height:1.4; }
#ri-plugin-layout .ri-primary { background:var(--ri-solid); color:var(--ri-on-solid); border-color:var(--ri-solid); }
#ri-plugin-layout .ri-list { margin-top:20px; }
#ri-plugin-layout .ri-section-label { margin-top:24px; color:var(--ri-sub); font-size:12px; }
#ri-plugin-layout .ri-available { margin-top:5px; }
#ri-plugin-layout .ri-item { display:flex; align-items:center; gap:12px; width:100%; padding:16px 0; color:var(--ri-fg); background:transparent; border:0; border-bottom:1px solid var(--ri-line); text-align:left; }
#ri-plugin-layout .ri-item:hover { background:var(--ri-hover); }
#ri-plugin-layout .ri-icon { display:grid; place-items:center; flex:none; background:var(--ri-hover); border-radius:9px; width:35px; height:35px; }
#ri-plugin-layout .ri-item-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
#ri-plugin-layout strong { font-weight:500; font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
#ri-plugin-layout small { font-size:12px; line-height:1.4; color:var(--ri-sub); overflow-wrap:anywhere; }
#ri-plugin-layout .ri-status { font-size:11px; color:var(--ri-sub); flex:none; }
#ri-plugin-layout .ri-item>svg { width:14px; height:14px; color:var(--ri-sub); flex:none; }
#ri-plugin-layout .ri-text-button { display:inline-flex; gap:7px; align-items:center; padding:15px 0 0; background:transparent; border:0; color:var(--ri-sub); font-size:12px; }
#ri-plugin-layout .ri-preferences { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:27px; font-size:12px; color:var(--ri-sub); }
#ri-plugin-layout select,#ri-plugin-layout input,#ri-plugin-layout textarea { background:var(--ri-bg); color:var(--ri-fg); border:1px solid var(--ri-line); border-radius:7px; padding:9px 10px; font-family:inherit; font-size:12px; line-height:1.5; max-width:100%; box-sizing:border-box; }
#ri-plugin-layout .ri-button svg,#ri-plugin-layout .ri-icon svg,#ri-plugin-layout .ri-text-button svg { width:16px; height:16px; flex:none; }
#ri-plugin-layout label { display:flex; flex-direction:column; gap:7px; margin-top:18px; font-size:12px; }
#ri-plugin-layout .ri-preferences label { margin:0; }
#ri-plugin-layout textarea { min-height:96px; width:100%; resize:vertical; }
#ri-plugin-layout .ri-choice { display:flex; flex-direction:column; gap:5px; align-items:flex-start; width:100%; background:transparent; color:var(--ri-fg); border:0; border-bottom:1px solid var(--ri-line); padding:17px 0; text-align:left; }
#ri-plugin-layout .ri-back { margin-bottom:22px; padding-top:0; }
#ri-plugin-layout [hidden] { display:none !important; }
#ri-plugin-layout .ri-return { margin-top:20px; }
@media(max-width:460px) {
  #ri-plugin-layout .ri-stage { min-height:725px; padding:8px 0; }
  #ri-plugin-layout .ri-window { min-height:665px; }
  #ri-plugin-layout .ri-header,#ri-plugin-layout .ri-panel,#ri-plugin-layout .ri-flow { padding:18px; }
  #ri-plugin-layout .ri-tabs { gap:19px; padding:0 18px; }
  #ri-plugin-layout .ri-tabs button { font-size:12px; }
  #ri-plugin-layout .ri-status { display:none; }
  #ri-plugin-layout .ri-item { gap:10px; }
}
@media(pointer:coarse) {
  #ri-plugin-layout .ri-button,#ri-plugin-layout .ri-tabs button,#ri-plugin-layout .ri-text-button { min-height:44px; }
  #ri-plugin-layout input,#ri-plugin-layout textarea,#ri-plugin-layout select { font-size:16px; }
}
</style>
<script>
(() => {
  const root = document.getElementById('ri-plugin-layout');
  const descriptions = {
    connect: '<h3>Connect a service</h3><p>Choose the service you use.</p><div class="ri-list"><button type="button" class="ri-choice" data-open="gmail"><strong>Gmail</strong><small>Email and drafts</small></button><button type="button" class="ri-choice" data-open="slack"><strong>Slack</strong><small>Messages and channels</small></button><button type="button" class="ri-choice" data-open="notion"><strong>Notion</strong><small>Pages and documents</small></button></div>',
    skill: '<h3>Add a skill</h3><p>Bring in an existing skill.</p><label>Skill URL<input type="url" placeholder="https://github.com/…"></label><label>Or choose a skill file<input type="file" accept=".md"></label>',
    build: '<h3>Build a skill</h3><p>Your agent helps turn a way of working into a reusable skill.</p><label>What should this skill help your agents do?<textarea placeholder="For example, review pull requests using our team’s checklist."></textarea></label>',
    mcp: '<h3>Add an MCP server</h3><p>Use the URL provided by the server.</p><label>Name<input placeholder="Research tools"></label><label>Server URL<input type="url" placeholder="https://example.com/mcp"></label><label>Permissions<select><option>Ask before writes</option><option>Always allow</option><option>Ask every time</option></select></label>',
    gmail: '<h3>Gmail</h3><p>Connected account</p><div class="ri-list"><div class="ri-item"><span class="ri-item-text"><strong>Personal</strong><small>Email and drafts</small></span><span class="ri-status">Connected</span></div></div><div class="ri-preferences"><span>Permissions</span><span>Manage by tool</span></div>',
    slack: '<h3>Slack</h3><p>Connected account</p><div class="ri-list"><div class="ri-item"><span class="ri-item-text"><strong>Team</strong><small>Messages and channels</small></span><span class="ri-status">Connected</span></div></div>',
    notion: '<h3>Notion</h3><p>Connect your account to give agents access to pages and documents.</p>',
    github: '<h3>GitHub</h3><p>Connect your account to give agents access to repositories and pull requests.</p>',
    review: '<h3>Review a pull request</h3><p>Check changes and leave clear feedback.</p><div class="ri-preferences"><span>Available to</span><span>All agents</span></div>',
    notes: '<h3>Meeting notes</h3><p>Draft skill</p><label>Instructions<textarea>Turn meeting notes into decisions, open questions and follow-ups.</textarea></label>',
    research: '<h3>Research tools</h3><p>research.example.com</p><div class="ri-preferences"><span>Status</span><span>Connected</span></div><label>Permissions<select><option>Use global default</option><option>Ask before writes</option><option>Always allow</option><option>Ask every time</option></select></label><button type="button" class="ri-text-button" data-open="views">Interactive views<i data-lucide="arrow-right" aria-hidden="true"></i></button>',
    views: '<h3>Research tools</h3><p>Interactive views</p><div class="ri-list"><div class="ri-item"><span class="ri-icon"><i data-lucide="panels-top-left" aria-hidden="true"></i></span><span class="ri-item-text"><strong>Results explorer</strong><small>Browse the results of your agent’s research</small></span></div></div>',
    add: '<h3>Add to your agents</h3><div class="ri-list"><button type="button" class="ri-choice" data-open="connect"><strong>Connect a service</strong><small>Connect an account you use</small></button><button type="button" class="ri-choice" data-open="skill"><strong>Add a skill</strong><small>Bring in an existing skill</small></button><button type="button" class="ri-choice" data-open="build"><strong>Build a skill</strong><small>Work with an agent to create one</small></button><button type="button" class="ri-choice" data-open="mcp"><strong>Add an MCP server</strong><small>Connect a server by URL</small></button></div>'
  };
  function icons() { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width:16, height:16 } }); }
  function returnToList(window) {
    window.querySelector('.ri-flow').hidden = true;
    window.querySelectorAll('.ri-panel').forEach(panel => {
      panel.hidden = panel.hasAttribute('role') && panel.id !== window.querySelector('[role=tab][aria-selected=true]')?.getAttribute('aria-controls');
    });
  }
  function chooseTab(window, tab) {
    window.querySelectorAll('[role=tab]').forEach(button => button.setAttribute('aria-selected', String(button === tab)));
    returnToList(window);
  }
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button)) return;
    const window = button.closest('.ri-window');
    if (!window) return;
    if (button.matches('[role=tab]')) { chooseTab(window, button); return; }
    if (button.hasAttribute('data-back')) { returnToList(window); return; }
    const action = button.getAttribute('data-open');
    if (!action || !descriptions[action]) return;
    window.querySelectorAll('.ri-panel').forEach(panel => panel.hidden = true);
    const flow = window.querySelector('.ri-flow');
    flow.innerHTML = '<button type="button" class="ri-text-button ri-back" data-back><i data-lucide="arrow-left" aria-hidden="true"></i>Back</button>' + descriptions[action];
    flow.hidden = false;
    icons();
  });
  root.addEventListener('keydown', event => {
    const current = event.target.closest('[role=tab]');
    if (!current || !['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
    event.preventDefault();
    const tabs = Array.from(current.closest('[role=tablist]').querySelectorAll('[role=tab]'));
    const offset = event.key === 'ArrowLeft' ? -1 : 1;
    const index = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (tabs.indexOf(current) + offset + tabs.length) % tabs.length;
    chooseTab(current.closest('.ri-window'), tabs[index]); tabs[index].focus();
  });
  const options = { showSecondaryText:true };
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container:root.querySelector('[data-design=destinations]'), onChange:() => {
      root.querySelector('[data-design=destinations]').querySelectorAll('.ri-item-text small').forEach(text => text.hidden = !options.showSecondaryText);
    } });
    tweak.addToggle(options,'showSecondaryText',{ label:'Show item descriptions' });
  }
})();
</script>
