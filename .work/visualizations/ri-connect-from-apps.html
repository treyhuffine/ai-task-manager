  </div>
</div>

<script>
(() => {
  const root = document.getElementById('ri-connect-study');
  const main = root.querySelector('.rc-main');
  const status = root.querySelector('.rc-status');
  const accounts = {
    personal: { name: 'Personal', email: 'alex.personal@example.com' },
    work: { name: 'Work', email: 'alex.work@example.com' }
  };
  const allowedViews = ['apps', 'catalog', 'gmail', 'settings', 'settings-gmail', 'chat', 'finances'];
  const initialQuestion = 'Which subscriptions got more expensive this month?';
  function clean(saved) {
    const safe = saved && typeof saved === 'object' ? saved : {};
    return {
      view: allowedViews.includes(safe.view) ? safe.view : 'apps',
      account: Object.hasOwn(accounts, safe.account || '') ? safe.account : null,
      draft: typeof safe.draft === 'string' ? safe.draft.slice(0, 4000) : '',
      question: typeof safe.question === 'string' ? safe.question.slice(0, 4000) : initialQuestion,
      reviewed: safe.reviewed === true,
      withEmail: safe.withEmail === true,
      gmailContext: safe.gmailContext === true,
      selectedAccount: Object.hasOwn(accounts, safe.selectedAccount || '') ? safe.selectedAccount : 'personal'
    };
  }
  const stored = window.openai?.widgetState?.privateContent;
  let state = clean(stored?.previewVersion === 1 ? stored.connectionPreview : null);
  function cleanFlow(value) {
    return value && allowedViews.includes(value.origin) && ['review', 'signin'].includes(value.phase)
      ? { origin: value.origin, phase: value.phase }
      : null;
  }
  let pending = cleanFlow(stored?.previewVersion === 1 ? stored.connectionFlow : null);
  let notice = '';
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
  const icon = name => '<i data-lucide="' + name + '" aria-hidden="true"></i>';
  const button = (label, action, style = '', glyph = '') => '<button type="button" class="rc-button cursor-interaction ' + style + '" data-action="' + action + '">' + (glyph ? icon(glyph) : '') + esc(label) + '</button>';
  const link = (label, action, glyph = '') => '<button type="button" class="rc-link cursor-interaction" data-action="' + action + '">' + (glyph ? icon(glyph) : '') + esc(label) + '</button>';
  const mark = (name, large = false) => '<span class="rc-mark' + (large ? ' large' : '') + '">' + icon(name) + '</span>';
  const back = (label, action) => '<div class="rc-back">' + link(label, action, 'arrow-left') + '</div>';
  const account = () => state.account ? accounts[state.account] : null;
  function persist() {
    const save = window.openai?.setWidgetState;
    if (save) Promise.resolve(save.call(window.openai, {
      modelContent: null,
      privateContent: { previewVersion: 1, connectionPreview: state, connectionFlow: pending }
    })).catch(() => {});
  }
  function announce(text) { notice = text; }
  function appRow(name, text, glyph, action, controls) {
    return '<article class="rc-app-row">' + mark(glyph) + '<div class="rc-app-text"><button type="button" class="rc-app-name cursor-interaction" data-action="' + action + '">' + esc(name) + '</button><p>' + text + '</p></div><div class="rc-actions">' + controls + '</div></article>';
  }
  function library() {
    const who = account();
    return '<div class="rc-head"><div><h2>Apps</h2><p class="rc-subtitle">Use them with your agent or open a view.</p></div>' + button('Add app', 'catalog', 'primary', 'plus') + '</div>' +
      '<div class="rc-section-title">Your apps</div>' +
      appRow('Finances', 'Spending, accounts and budgets', 'wallet', 'finances', button('Open', 'finances') + button('Ask Ri', 'ask-finances', 'quiet')) +
      (who ? appRow('Gmail', esc(who.name) + ' · ' + esc(who.email), 'mail', 'gmail', button('Ask Ri', 'ask-gmail') + button('Details', 'gmail', 'quiet')) : '') +
      (!who ? '<div class="rc-section-title">Try with your agent</div>' + appRow('Gmail', 'Find messages and check receipts', 'mail', 'gmail', button('Connect', 'connect-library')) : '') +
      '<div class="rc-related">' + link('Manage accounts in Settings', 'settings', 'settings') + '</div>';
  }
  function catalog() {
    return back('Your apps', 'apps') +
      '<div class="rc-head"><div><h2>Add an app</h2><p class="rc-subtitle">Find something useful for the way you work.</p></div></div>' +
      '<div class="rc-search">' + icon('search') + '<input aria-label="Find an app" placeholder="Search apps" data-input="search" autocomplete="off"></div>' +
      '<div data-search-row data-search-text="gmail google email receipts">' + appRow('Gmail', 'Search messages and receipts with your agent', 'mail', 'gmail', button(state.account ? 'Connected' : 'Connect', state.account ? 'gmail' : 'connect-catalog')) + '</div>' +
      '<div data-search-row data-search-text="finances finance spending budgets">' + appRow('Finances', 'Spending, accounts and budgets', 'wallet', 'finances', button('Open', 'finances')) + '</div>' +
      '<p class="rc-empty" data-empty-search hidden>No matching apps in this preview.</p>';
  }
  function accountCard() {
    const who = account();
    return '<section class="rc-account-card" aria-label="Gmail account"><div class="rc-account-heading"><div><h3>' + esc(who.name) + '</h3><p>' + esc(who.email) + '</p></div><span class="rc-state">' + icon('check') + 'Connected</span></div>' +
      '<dl class="rc-account-facts"><dt>Used by</dt><dd>Personal agent</dd><dt>Access</dt><dd>Search and read email</dd></dl>' +
      '<div class="rc-actions">' + button('Check connection', 'check-account', 'quiet', 'refresh-cw') + button('Disconnect', 'disconnect', 'quiet danger') + '</div></section>';
  }
  function gmail(inSettings) {
    const who = account();
    const origin = inSettings ? 'settings' : 'apps';
    return back(inSettings ? 'Settings · Plugins · Connectors' : 'Your apps', origin) +
      '<div class="rc-head"><div class="rc-app-title">' + mark('mail', true) + '<div><h2>Gmail</h2><p class="rc-subtitle">Find messages and check receipts.</p></div></div>' +
      (who ? button('Ask Ri', 'ask-gmail', 'primary', 'message-circle') : '') + '</div>' +
      (who ? accountCard() : '<section class="rc-connect-prompt"><h3>Connect your Gmail account</h3><p class="rc-subtitle">Let your Personal agent search and read your email.</p><div class="rc-actions">' + button('Connect', inSettings ? 'connect-settings' : 'connect-gmail', 'primary') + '</div></section>') +
      (!inSettings ? '<div class="rc-example"><div class="rc-section-title">Try asking</div><button type="button" class="cursor-interaction" data-action="example">Find the renewal receipts for my subscriptions.</button></div>' : '') +
      '<div class="rc-related">' + link(inSettings ? 'View Gmail in Apps' : 'Manage in Settings', inSettings ? 'gmail' : 'settings-gmail', inSettings ? 'layout-grid' : 'settings') + '</div>';
  }
  function settings() {
    const who = account();
    return '<div class="rc-head"><h2>Settings</h2></div><div class="rc-settings-layout"><div class="rc-settings-nav" aria-label="Settings sections"><span>General</span><span>Profile</span><span class="active">Plugins</span></div><section class="rc-settings-content" aria-label="Plugins settings"><h3>Plugins</h3><div class="rc-tabs"><span class="rc-tab active">Connectors</span><span class="rc-tab">Skills</span></div>' +
      '<p class="rc-subtitle">Connect accounts and manage access.</p>' +
      appRow('Gmail', who ? esc(who.name) + ' · ' + esc(who.email) : 'Search and read email', 'mail', 'settings-gmail', button(who ? 'Manage' : 'Connect', who ? 'settings-gmail' : 'connect-settings-catalog')) +
      (who ? '<p class="rc-note">' + icon('check') + ' Connected · Available to Personal</p>' : '') +
      '</section></div>';
  }
  function connectFlow() {
    const returning = pending.origin === 'chat' ? 'Subscription review' : pending.origin.startsWith('settings') ? 'Settings' : 'Apps';
    if (pending.phase === 'review') {
      return back('Back to ' + returning, 'cancel-connect') + '<section class="rc-flow">' + mark('mail', true) +
        '<h2>Connect Gmail</h2><p class="rc-subtitle">Use your email with Ri.</p>' +
        '<dl class="rc-account-facts"><dt>Used by</dt><dd>Personal agent</dd><dt>Access</dt><dd>Search and read email</dd><dt>Return to</dt><dd>' + esc(returning) + '</dd></dl>' +
        '<p class="rc-subtitle">Choose the Google account you want to use.</p><div class="rc-actions">' +
        button('Continue to Google', 'provider-signin', 'primary', 'external-link') + button('Cancel', 'cancel-connect', 'quiet') +
        '</div><p class="rc-note">Preview only. The next screen uses sample accounts.</p></section>';
    }
    const options = Object.entries(accounts).map(([key, who]) =>
      '<label class="rc-account-option cursor-interaction"><input type="radio" name="ri-sample-account" value="' + key + '"' + (state.selectedAccount === key ? ' checked' : '') + '><div><span>' + esc(who.name) + '</span><small>' + esc(who.email) + '</small></div></label>'
    ).join('');
    return back('Back to Gmail setup', 'review-connect') + '<section class="rc-flow"><div class="rc-sample-label">Simulated Google sign-in</div><h2>Choose an account</h2><p class="rc-subtitle">Continue to Ri with a sample account.</p><fieldset class="rc-account-options"><legend>Google account</legend>' + options + '</fieldset>' +
      '<p class="rc-note">Allow Ri to search and read this account’s email.</p><div class="rc-actions">' + button('Allow and return to Ri', 'complete-connect', 'primary') + button('Cancel', 'cancel-connect', 'quiet') + '</div></section>';
  }
  function results() {
    return '<div class="rc-results"><div class="rc-result"><div>Streamly<small>Monthly renewal</small></div><strong>$15 → $19</strong></div><div class="rc-result"><div>Cloudbox<small>Monthly renewal</small></div><strong>$10 → $12</strong></div></div>';
  }
  function chat() {
    const who = account();
    const needConnection = !state.reviewed && state.question;
    let answer = '';
    if (state.reviewed) {
      answer = '<div class="rc-assistant"><p>Two subscriptions increased by a total of $6 per month.</p>' + results() +
        '<p class="rc-muted">' + (state.withEmail ? 'The renewal receipts match the new charges.' : 'Based on the transactions in Finances.') + '</p><div class="rc-chips"><span class="rc-chip">' + icon('wallet') + 'Finances</span>' +
        (state.withEmail ? '<span class="rc-chip">' + icon('mail') + 'Gmail' + (who ? ' · ' + esc(who.name) : ' · Disconnected') + '</span>' : '') + '</div>' +
        button('Open Finances', 'finances', '', 'arrow-up-right') + '</div>';
    } else if (needConnection) {
      answer = '<div class="rc-assistant"><p>I can compare your subscriptions with renewal receipts in Gmail.</p>' +
        '<div class="rc-connect-prompt"><div class="rc-app-title">' + mark('mail') + '<div><h3>' + (who ? 'Use Gmail · ' + esc(who.name) : 'Connect Gmail') + '</h3><p class="rc-subtitle">' + (who ? esc(who.email) : 'Search receipts with your Personal agent.') + '</p></div></div><div class="rc-actions">' +
        button(who ? 'Check renewal receipts' : 'Connect and continue', who ? 'review-email' : 'connect-chat', 'primary') + button('Use Finances only', 'review-finances', 'quiet') + '</div></div></div>';
    }
    return '<section class="rc-chat"><div class="rc-chat-meta"><span class="rc-avatar">P</span><span>Personal</span><span> / </span><span>' + (state.question ? 'Subscription review' : 'New chat') + '</span></div>' +
      (state.question ? '<div class="rc-user-message">' + esc(state.question) + '</div>' : '<h2>What would you like to work on?</h2>') + answer +
      '<div class="rc-compose">' +
      (state.gmailContext && who ? '<div class="rc-chips"><span class="rc-chip">' + icon('mail') + '@Gmail · ' + esc(who.name) + '</span></div>' : '') +
      '<textarea aria-label="Message Personal" placeholder="Message Personal…" data-input="draft" maxlength="4000"></textarea><div class="rc-compose-footer"><span>Personal agent</span>' + button('Send', 'send', 'primary', 'arrow-up') + '</div></div></section>';
  }
  function finances() {
    return back('Back to ' + (state.reviewed ? 'subscription review' : 'Apps'), state.reviewed ? 'chat' : 'apps') +
      '<div class="rc-head"><div class="rc-app-title">' + mark('wallet', true) + '<div><h2>Finances</h2><p class="rc-subtitle">Subscriptions</p></div></div>' + button('Ask Ri', 'ask-finances', '', 'message-circle') + '</div>' +
      '<div class="rc-section-title">Changes this month</div>' + results() + '<p class="rc-note">Sample transactions</p>';
  }
  function render() {
    const place = state.view.startsWith('settings') ? 'settings' : state.view === 'chat' ? 'chat' : 'apps';
    root.querySelectorAll('[data-place]').forEach(item => {
      if (item.dataset.place === place) item.setAttribute('aria-current', 'page');
      else item.removeAttribute('aria-current');
    });
    status.hidden = !notice;
    status.textContent = notice;
    if (pending) main.innerHTML = connectFlow();
    else main.innerHTML = ({
      apps: library,
      catalog,
      gmail: () => gmail(false),
      settings,
      'settings-gmail': () => gmail(true),
      chat,
      finances
    })[state.view]();
    const draft = main.querySelector('[data-input="draft"]');
    if (draft) draft.value = state.draft;
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  }
  function navigate(view) {
    pending = null;
    notice = '';
    state.view = view;
  }
  function begin(origin) {
    state.view = origin;
    pending = { origin, phase: 'review' };
    notice = '';
  }
  root.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (!target || !root.contains(target) || target.disabled) return;
    const action = target.dataset.action;
    if (allowedViews.includes(action)) {
      navigate(action);
    } else if (action === 'new-chat') {
      navigate('chat');
      state.question = '';
      state.reviewed = false;
      state.withEmail = false;
      state.gmailContext = false;
    } else if (action.startsWith('connect-')) {
      const origins = { 'connect-library':'apps', 'connect-catalog':'catalog', 'connect-gmail':'gmail', 'connect-settings':'settings-gmail', 'connect-settings-catalog':'settings', 'connect-chat':'chat' };
      if (origins[action]) begin(origins[action]);
    } else if (action === 'provider-signin' && pending) {
      pending.phase = 'signin';
    } else if (action === 'review-connect' && pending) {
      pending.phase = 'review';
    } else if (action === 'cancel-connect' && pending) {
      state.view = pending.origin;
      pending = null;
    } else if (action === 'complete-connect' && pending) {
      const origin = pending.origin;
      state.account = state.selectedAccount;
      pending = null;
      state.view = origin === 'chat' ? 'chat' : origin.startsWith('settings') ? 'settings-gmail' : 'gmail';
      if (origin === 'chat') {
        state.reviewed = true;
        state.withEmail = true;
        state.gmailContext = true;
      }
      announce('Gmail · ' + account().name + ' connected. Available to Personal.');
    } else if (action === 'disconnect') {
      state.account = null;
      state.gmailContext = false;
      announce('Gmail disconnected. Personal no longer has access.');
    } else if (action === 'check-account') {
      announce('Gmail · ' + account().name + ' is connected.');
    } else if (action === 'ask-gmail' || action === 'example') {
      if (!state.account) {
        state.view = 'chat';
        state.question = initialQuestion;
        state.reviewed = false;
        begin('chat');
      } else {
        navigate('chat');
        state.gmailContext = true;
        if (!state.draft) state.draft = 'Find the renewal receipts for my subscriptions.';
      }
    } else if (action === 'ask-finances') {
      navigate('chat');
      if (!state.draft) state.draft = initialQuestion;
    } else if (action === 'review-email') {
      state.reviewed = true;
      state.withEmail = true;
      state.gmailContext = true;
      notice = '';
    } else if (action === 'review-finances') {
      state.reviewed = true;
      state.withEmail = false;
      notice = '';
    } else if (action === 'send') {
      if (!state.draft.trim()) return;
      state.question = state.draft.trim();
      state.draft = '';
      state.reviewed = Boolean(state.account);
      state.withEmail = Boolean(state.account);
      state.gmailContext = Boolean(state.account);
      notice = '';
    }
    render();
    persist();
  });
  root.addEventListener('input', event => {
    const target = event.target;
    if (target.dataset.input === 'draft') {
      state.draft = target.value.slice(0, 4000);
      persist();
    }
    if (target.dataset.input === 'search') {
      const query = target.value.trim().toLowerCase();
      let count = 0;
      root.querySelectorAll('[data-search-row]').forEach(row => {
        row.hidden = !row.dataset.searchText.includes(query);
        if (!row.hidden) count++;
      });
      root.querySelector('[data-empty-search]').hidden = count !== 0;
    }
  });
  root.addEventListener('change', event => {
    if (event.target.name === 'ri-sample-account' && Object.hasOwn(accounts, event.target.value)) {
      state.selectedAccount = event.target.value;
      persist();
    }
  });
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape' && pending) {
      event.preventDefault();
      state.view = pending.origin;
      pending = null;
      render();
      persist();
    }
  });
  window.addEventListener('openai:set_globals', event => {
    const value = event.detail?.globals?.widgetState?.privateContent;
    if (value?.previewVersion !== 1) return;
    const next = clean(value.connectionPreview);
    const flow = cleanFlow(value.connectionFlow);
    if (JSON.stringify(next) === JSON.stringify(state) && JSON.stringify(flow) === JSON.stringify(pending)) return;
    state = next;
    pending = flow;
    notice = '';
    render();
  });
  render();
})();
</script>
