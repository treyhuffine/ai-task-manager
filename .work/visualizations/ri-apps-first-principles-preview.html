:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)

  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host&#x27;s design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ri-apps-study&#x27;);
  const saved = window.openai?.widgetState?.privateContent?.journeys || {};
  const states = {};
  const esc = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const icon = name =&gt; `&lt;i data-lucide=&quot;${name}&quot; class=&quot;ri-icon&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const button = (label, action, primary = false, extra = &#x27;&#x27;) =&gt; `&lt;button type=&quot;button&quot; class=&quot;ri-button cursor-interaction ${primary ? &#x27;primary&#x27; : &#x27;&#x27;}&quot; data-action=&quot;${action}&quot; ${extra}&gt;${label}&lt;/button&gt;`;
  const apps = [
    {id:&#x27;gmail&#x27;, name:&#x27;Gmail&#x27;, icon:&#x27;mail&#x27;, purpose:&#x27;Find emails, receipts and answers.&#x27;},
    {id:&#x27;finances&#x27;, name:&#x27;Finances&#x27;, icon:&#x27;wallet&#x27;, purpose:&#x27;Understand your spending and subscriptions.&#x27;},
    {id:&#x27;excalidraw&#x27;, name:&#x27;Excalidraw&#x27;, icon:&#x27;shapes&#x27;, purpose:&#x27;Turn ideas into editable diagrams.&#x27;}
  ];
  function persist() {
    const payload = {modelContent:{study:&#x27;Ri app experience&#x27;, preference:&#x27;exploring&#x27;}, privateContent:{journeys:states}};
    window.openai?.setWidgetState?.(payload)?.catch(() =&gt; {});
  }
  function composer(s) {
    const chip = s.mention ? `&lt;div class=&quot;ri-chip&quot;&gt;@${esc(s.mention)} &lt;button type=&quot;button&quot; data-action=&quot;remove-mention&quot; aria-label=&quot;Remove app mention&quot;&gt;${icon(&#x27;x&#x27;)}&lt;/button&gt;&lt;/div&gt;` : &#x27;&#x27;;
    const selected = s.selected ? `&lt;div class=&quot;ri-chip&quot;&gt;${s.selected} selected in Finances&lt;/div&gt;` : &#x27;&#x27;;
    return `&lt;div class=&quot;ri-composer&quot;&gt;${chip}${selected}&lt;textarea aria-label=&quot;Message Ri&quot; placeholder=&quot;Ask Ri anything…&quot;&gt;${esc(s.draft)}&lt;/textarea&gt;&lt;div class=&quot;ri-composerbar&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ri-button quiet cursor-interaction&quot; data-action=&quot;picker&quot;&gt;${icon(&#x27;at-sign&#x27;)} Add context&lt;/button&gt;${button(icon(&#x27;arrow-up&#x27;),&#x27;send&#x27;,true,&#x27;aria-label=&quot;Send sample message&quot;&#x27;)}&lt;/div&gt;${s.picker ? `&lt;div class=&quot;ri-picker&quot; aria-label=&quot;Apps to use in this message&quot;&gt;${apps.map(app=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;mention-${app.id}&quot;&gt;&lt;span&gt;${esc(app.name)}${app.id===&#x27;gmail&#x27;&amp;&amp;s.gmail?&#x27; · &#x27;+esc(s.account):&#x27;&#x27;}&lt;/span&gt;&lt;small&gt;${app.id===&#x27;gmail&#x27;&amp;&amp;!s.gmail?&#x27;Connect to use&#x27;:app.id===&#x27;excalidraw&#x27;&amp;&amp;!s.drawingAdded?&#x27;Add to use&#x27;:&#x27;Use in this message&#x27;}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;`;
  }
  function appRow(app, s, add = false) {
    let actions = &#x27;&#x27;;
    let detail = app.purpose;
    if (app.id === &#x27;gmail&#x27;) {
      detail = s.gmail ? `${esc(s.account)} account · Search and read email` : app.purpose;
      actions = s.gmail ? button(&#x27;Ask Ri&#x27;,&#x27;ask-gmail&#x27;) : button(&#x27;Connect&#x27;,&#x27;connect-gmail&#x27;,true);
    } else if (app.id === &#x27;finances&#x27;) {
      actions = button(&#x27;Open&#x27;,&#x27;open-finances&#x27;,true) + button(&#x27;Ask Ri&#x27;,&#x27;ask-finances&#x27;);
    } else {
      actions = s.drawingAdded ? button(s.hasDrawing?&#x27;Open drawing&#x27;:&#x27;Ask Ri&#x27;,s.hasDrawing?&#x27;open-drawing&#x27;:&#x27;ask-excalidraw&#x27;) : button(&#x27;Add&#x27;,&#x27;add-excalidraw&#x27;);

  function library(s) {

  }
  function connect(s) {
    return `${button(icon(&#x27;arrow-left&#x27;)+&#x27; Back&#x27;,&#x27;back&#x27;)}&lt;div class=&quot;ri-form&quot;&gt;&lt;div class=&quot;ri-appmark&quot;&gt;${icon(&#x27;mail&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;h2&gt;Use Gmail with Ri&lt;/h2&gt;&lt;p class=&quot;ri-muted&quot;&gt;Find receipts for your subscription review.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ri-accounts&quot;&gt;&lt;label class=&quot;ri-account&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;${s.key}-account&quot; value=&quot;Personal&quot; ${s.account===&#x27;Personal&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;Personal account&lt;/label&gt;&lt;label class=&quot;ri-account&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;${s.key}-account&quot; value=&quot;Work&quot; ${s.account===&#x27;Work&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;Work account&lt;/label&gt;&lt;/div&gt;&lt;dl class=&quot;ri-detail&quot;&gt;&lt;dt&gt;Used by&lt;/dt&gt;&lt;dd&gt;Personal agent&lt;/dd&gt;&lt;dt&gt;Access&lt;/dt&gt;&lt;dd&gt;Search and read email&lt;/dd&gt;&lt;/dl&gt;&lt;p class=&quot;ri-muted&quot;&gt;You can change access from Gmail in Apps.&lt;/p&gt;${button(&#x27;Connect and continue&#x27;,&#x27;confirm-connect&#x27;,true)}&lt;/div&gt;`;
  }
  function details(s) {
    const app = apps.find(a=&gt;a.id===s.detail) || apps[0];
    return `${button(icon(&#x27;arrow-left&#x27;)+&#x27; Apps&#x27;,&#x27;apps&#x27;)}&lt;div class=&quot;ri-form&quot;&gt;&lt;div class=&quot;ri-appmark&quot;&gt;${icon(app.icon)}&lt;/div&gt;&lt;div&gt;&lt;h2&gt;${app.name}&lt;/h2&gt;&lt;p class=&quot;ri-muted&quot;&gt;${app.purpose}&lt;/p&gt;&lt;/div&gt;${app.id===&#x27;gmail&#x27;?`&lt;dl class=&quot;ri-detail&quot;&gt;&lt;dt&gt;Account&lt;/dt&gt;&lt;dd&gt;${s.gmail?esc(s.account):&#x27;Not connected&#x27;}&lt;/dd&gt;&lt;dt&gt;Used by&lt;/dt&gt;&lt;dd&gt;${s.gmail?&#x27;Personal agent&#x27;:&#x27;Choose when connecting&#x27;}&lt;/dd&gt;&lt;dt&gt;Access&lt;/dt&gt;&lt;dd&gt;${s.gmail?&#x27;Search and read email&#x27;:&#x27;Not granted&#x27;}&lt;/dd&gt;&lt;/dl&gt;&lt;div class=&quot;ri-actions&quot;&gt;${s.gmail?button(&#x27;Ask Ri&#x27;,&#x27;ask-gmail&#x27;,true)+button(&#x27;Disconnect&#x27;,&#x27;disconnect&#x27;):button(&#x27;Connect&#x27;,&#x27;connect-gmail&#x27;,true)}&lt;/div&gt;`:`&lt;div class=&quot;ri-actions&quot;&gt;${app.id===&#x27;finances&#x27;?button(&#x27;Open&#x27;,&#x27;open-finances&#x27;,true):s.hasDrawing?button(&#x27;Open drawing&#x27;,&#x27;open-drawing&#x27;,true):&#x27;&#x27;}${button(&#x27;Ask Ri&#x27;,&#x27;ask-&#x27;+app.id)}&lt;/div&gt;`}&lt;/div&gt;`;

  function financeView(s) {

(() =&gt; {
  if (window.FloatingUIDOM == null) {

  }

  const skipDelay = 300;

  let pendingTrigger = null;

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

    }

    }
  };

    lastPointerWasTouch = false;

    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,

  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);

  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);

    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {

    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);

})();
