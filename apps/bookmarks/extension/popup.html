<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save to Ri</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 320px; padding: 14px; }
  .title { overflow-wrap: anywhere; font-weight: 500; }
  .site { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main class="stack" id="main" aria-live="polite">
  <p id="status">Saving</p>
  <div class="tight" id="page" hidden>
    <p class="title" id="title"></p>
    <p class="muted site" id="site"></p>
  </div>
  <form class="stack" id="details" hidden>
    <label>Tags <input type="text" id="tags" placeholder="Separate with commas" autocomplete="off"></label>
    <label>Note <textarea id="note" rows="3"></textarea></label>
    <div class="row spread">
      <button type="button" id="open">Open Bookmarks</button>
      <button type="submit" class="primary" id="add">Add</button>
    </div>
  </form>
  <button type="button" class="primary" id="connect" hidden>Connect to your Ri</button>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
