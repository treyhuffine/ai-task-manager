<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap');

}

    {id:'life',name:'Get life organized',icon:'house',description:'Money, your calendar, and a weekly reset.',items:['finances','calendar','weekly'],copy:'A clear view of your money and time, plus a simple rhythm for staying on top of both.'},
    {id:'ideas',name:'Bring ideas to life',icon:'pencil-ruler',description:'Research, clear stories, and project work.',items:['research','slides','linear'],copy:'Go from a question to a grounded idea, a clear presentation, and the work to make it real.'}
  ];

  const defaults = key => ({view:'main',selected:key==='preview'?'finances':null,query:'',filter:'All',all:false,added:['finances','people','gmail','weekly','company'],off:['company'],pinned:['finances','people','gmail','weekly'],panel:'overview',bundle:'business',dock:'discover',openTabs:['finances','people'],scope:'Design',agentTools:['people','gmail'],draft:'',sent:'',confirm:false,notice:'',createMode:'build',currency:'USD',instructions:'Keep it clear and practical. Use my preferred tone.',access:'Ask before making changes',density:'Comfortable',descriptions:true,railOpen:!['preview','agent','chat'].includes(key),done:[]});

  function card(s,i){return `<article class="rx-tile"><button type="button" class="rx-tile-top cursor-interaction" data-action="select" data-id="${i.id}" aria-label="Details for ${esc(i.name)}">${mark(i)}<span><span class="rx-title">${i.name}</span><span class="rx-description">${i.description}</span></span></button><div class="rx-tile-bottom"><span class="rx-state">${has(s,i)?icon(active(s,i)?'check':'circle-pause'):''}${stateLabel(s,i)}</span>${primary(s,i)}${has(s,i)?ib('settings-2',`Manage ${i.name}`,'manage',i.id):''}</div></article>`;}
  function flat(s,i,inline=false){return `<div class="rx-flat-row"><button type="button" class="rx-flat-main cursor-interaction" data-action="select" data-id="${i.id}" aria-label="Details for ${esc(i.name)}">${mark(i)}<span><span class="rx-title">${i.name}</span><span class="rx-description">${i.description}</span></span></button><div class="rx-flat-actions"><span class="rx-state">${has(s,i)?(active(s,i)?'Added':'Off'):''}</span>${primary(s,i)}${has(s,i)?ib('settings-2',`Manage ${i.name}`,'manage',i.id):''}</div></div>${inline&&s.selected===i.id?`<div class="rx-inline-detail">${detailBody(s,i)}</div>`:''}`;}
  function ownedRows(s){return own(s).map(i=>`<div class="rx-owned-row"><button type="button" class="rx-own-open cursor-interaction" data-action="${active(s,i)?(i.kind==='app'?'open':'try'):'manage'}" data-id="${i.id}">${mark(i)}<span class="rx-own-copy"><span>${i.name}</span><span>${!active(s,i)?'Turned off':i.kind==='app'?'Open app':i.kind==='connection'?'Work account':i.kind==='mcp'?'Custom connection':'Use in chat'}</span></span></button>${ib('settings-2',`Manage ${i.name}`,'manage',i.id)}</div>`).join('');}
  function sectionTitle(name,actionLabel='',action='',count=''){return `<div class="rx-section-title"><h2>${name}${count!==''?` <span>${count}</span>`:''}</h2>${actionLabel?btn(actionLabel,action,'','rx-quiet'):''}</div>`;}
  function search(s,placeholder='Search a name or something you want to do'){return `<label class="rx-search">${icon('search')}<input data-field="query" type="search" value="${esc(s.query)}" placeholder="${esc(placeholder)}" aria-label="Search additions">${s.query?ib('x','Clear search','clear'):''}</label>`;}
  function filters(s,names=['All','Work','Life','Create']){return `<div class="rx-filters" aria-label="Browse filters">${names.map(n=>`<button type="button" class="rx-filter cursor-interaction" data-action="filter" data-id="${n}" aria-pressed="${s.filter===n}">${n}</button>`).join('')}</div>`;}
  function matching(s,list=catalog){
    const words=(s.query.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!['help','me','i','want','to','my','the','a','an','with','and','do','make','manage'].includes(w));
    const aliases={finances:'money budget spending finances bills',people:'crm contacts relationships customers',gmail:'email mail inbox account',calendar:'calendar schedule meetings account',slack:'team messages account',linear:'project tasks issues account',weekly:'week planning review organize',travel:'trip vacation travel plans',slides:'presentation slides deck',proposal:'writing proposal voice',research:'research sources report brief',company:'custom mcp server data metrics reports'};
    return list.filter(i=>{
      const haystack=`${i.name} ${i.description} ${i.detail} ${i.kind} ${aliases[i.id]}`.toLowerCase();
      return (!words.length||words.some(w=>haystack.includes(w.length>4?w.replace(/s$/,''):w)))&&(s.filter==='All'||s.filter==='Added'&&has(s,i)||s.filter==='Available'&&!has(s,i)||s.filter===i.group);
    });
  }
  function tiles(s,list=catalog,limit=6){const matches=matching(s,list);return `<div class="rx-tiles">${matches.slice(0,s.all||s.query?99:limit).map(i=>card(s,i)).join('')}</div>${!matches.length?'<p class="rx-empty">No matches. Try a name or something you want help with.</p>':''}${matches.length>limit&&!s.all&&!s.query?`<div class="rx-foot-link">${btn(`Browse all ${matches.length}`+` ${icon('arrow-right')}`,'all','','rx-quiet')}</div>`:''}`;}
  function quick(s){return `<div class="rx-quick">${s.pinned.map(item).filter(i=>active(s,i)).map(i=>`<button type="button" class="rx-shortcut-item cursor-interaction" data-action="${i.kind==='app'?'open':'try'}" data-id="${i.id}">${mark(i,true)}<span>${i.name}</span></button>`).join('')}</div>`;}
  function head(title='Apps',subtitle='More ways to work with Ri.',actions='',glyph='layout-grid'){return `<header class="rx-page-head"><span class="rx-mark">${icon(glyph)}</span><div class="rx-grow"><h1>${title}</h1><p>${subtitle}</p></div><div class="rx-head-actions">${actions||btn(icon('hammer')+' Build','create','','rx-quiet')+btn(icon('plus')+' Add your own','create','','rx-primary')}</div></header>`;}
  function nav(label,glyph,action,selected=false,id=''){return `<button type="button" class="rx-nav cursor-interaction" data-action="${action}" data-id="${id}" aria-label="${label}"${selected?' aria-current="page"':''}>${icon(glyph)}<span class="rx-nav-text">${label}</span>${label==='Apps'?`<span class="rx-count">${icon('chevron-right')}</span>`:''}</button>`;}
  function rail(s,key){

    const owned=`<div class="rx-list-header"><span class="rx-kicker">Your library</span><span class="rx-grow"></span>${ib('settings-2','Manage library','library')}</div>${own(s).map(i=>`<div class="rx-rail-owned"><button type="button" class="cursor-interaction" data-action="${active(s,i)?(i.kind==='app'?'open':'try'):'manage'}" data-id="${i.id}">${mark(i,true)}<span class="rx-owner-name">${i.name}${!active(s,i)?' <span class="rx-tiny">Off</span>':''}</span></button>${ib('settings-2',`Manage ${i.name}`,'manage',i.id)}</div>`).join('')}<div class="rx-line"></div><p class="rx-rail-note rx-tiny" style="padding:8px">Added once, ready wherever you work.</p><div class="rx-list-header"><button type="button" class="cursor-interaction" data-action="agent-view">${icon('bot')} Back to agents</button></div>`;
    return `<aside class="rx-rail" aria-label="Ri navigation"><div class="rx-home"><button type="button" class="cursor-interaction" data-action="home-view" aria-label="Ri home"><span class="rx-brand">Ri</span><span class="rx-home-label">Ri</span></button><span class="rx-collapse">${ib('panel-left-close','Collapse rail','rail-toggle')}</span></div>${nav('New chat','plus','new-chat')}${nav('Search chats','search','search-chats')}<div class="rx-line"></div>${nav('Apps','layout-grid','main',isApps)}${key==='rail'?`<div class="rx-rail-mode">${nav('Discover','compass','main',s.view==='main')}${nav('Your library','library','library',s.view==='library')}</div>`:''}${nav('Task Board','square-kanban','board')}${nav('Calendar','calendar','calendar-view')}${nav('Schedules and Triggers','clock','schedules')}<div class="rx-rail-bot">${nav('Agents','bot','agent-view')}</div>${key==='rail'?owned:agents}<div class="rx-foot">${nav('Settings','settings','settings')}<div class="rx-account-link">${nav('Connect accounts','plug','accounts')}</div></div></aside>`;
  }
  function hud(key){return `<div class="rx-hud"><div class="rx-statuses"><span class="rx-status">${icon('circle-alert')} 1</span><span class="rx-status">${icon('circle')} 2</span><span class="rx-status">${icon('zap')} 1</span><span class="rx-status">${icon('clock')} 0</span>${icon('gauge')}</div>${btn(icon('x')+' <span>Close '+(['home','chat','agent'].includes(key)?'view':'apps')+'</span> <span class="rx-shortcut">⌘E</span>','home-view','','rx-quiet')}<span class="rx-grow"></span><span class="rx-hud-event rx-muted">${icon('calendar')} Design review in 24m</span>${ib('search','Search Ri','global-search')}${btn(icon('plus')+' CREATE','create','','rx-primary')}</div><div class="rx-mobile-top"><span class="rx-brand">Ri</span><strong>Ri</strong><span class="rx-grow"></span>${ib('search','Search Ri','global-search')}${ib('layout-grid','Apps','main')}</div>`;}
  function miniature(){return `<div class="rx-mini-preview"><span class="rx-tiny">YOUR NEXT TRIP</span><strong>Lisbon</strong><div class="rx-mini-row"><span>Friday</span><span>Arrive and settle in</span></div><div class="rx-mini-row"><span>Saturday</span><span>Explore Alfama</span></div><div class="rx-mini-row"><span>Sunday</span><span>A day in Sintra</span></div></div>`;}
  function discover(s){return `${head()}<div class="rx-page">${sectionTitle('Your library','Manage','library',s.added.length)}${quick(s)}<section class="rx-section"><div class="rx-section-title"><h2>Discover</h2><span class="rx-tiny">Make Ri your own</span></div>${search(s)}${filters(s)}${!s.query&&s.filter==='All'&&!s.all?`<div class="rx-hero"><div><span class="rx-kicker">Made for everyday life</span><h2>A whole trip, all together.</h2><p>Places, plans, and bookings in one shared itinerary.</p>${btn('Explore Travel '+icon('arrow-right'),'select','travel')}</div>${miniature()}</div>`:''}${tiles(s,s.query?catalog:catalog.filter(i=>!has(s,i)),6)}</section></div>`;}
  function split(s){return `${head('Apps','Your library and the next thing you can do.')}<div class="rx-split-library"><section class="rx-owned-pane">${sectionTitle('Your library','','',s.added.length)}<p class="rx-tiny">Ready when you need it.</p>${ownedRows(s)}<div class="rx-space"></div>${btn(icon('plus')+' Add your own','create','','rx-quiet')}</section><section class="rx-catalog-pane">${s.selected?detail(s,item(s.selected),true):`${sectionTitle('Discover')}${search(s,'Find more for your Ri')}${filters(s)}${tiles(s,catalog.filter(i=>!has(s,i)),4)}`}</section></div>`;}
  function railLayout(s){return `${head('Discover','Find your next useful addition.',btn(icon('hammer')+' Build','create','','rx-quiet')+btn(icon('plus')+' Add your own','create'))}<div class="rx-page">${search(s)}${filters(s)}<div class="rx-section-title"><h2>${s.query?'Search results':'Make more possible'}</h2><span class="rx-tiny">Apps, services, and ways of working</span></div>${tiles(s,s.query?catalog:catalog.filter(i=>!has(s,i)),8)}</div>`;}
  function collection(s){const groups=[{name:'Stay connected',hint:'People and conversations.',ids:['people','gmail','slack','linear']},{name:'Make room for life',hint:'Money, time, and plans.',ids:['finances','calendar','travel','weekly']},{name:'Think and create',hint:'From information to something useful.',ids:['research','slides','proposal','company']}];return `${head('Apps','Everything Ri can do, together.')}<div class="rx-page">${search(s)}${filters(s,['All','Added','Available'])}${groups.map(g=>{const rows=matching(s,g.ids.map(item));return rows.length?`<section class="rx-purpose"><div><h3>${g.name}</h3><p>${g.hint}</p></div><div>${rows.map(i=>flat(s,i,true)).join('')}</div></section>`:''}).join('')}${!matching(s).length?'<p class="rx-empty">No matching additions.</p>':''}</div>`;}
  function composer(s,label='Message Ri…'){return `<div class="rx-composer"><textarea data-field="draft" aria-label="Message Ri" placeholder="${label}">${esc(s.draft)}</textarea><div class="rx-compose-bottom">${ib('plus','Attach a file','attach')}${icon('at-sign')}<span>Claude</span>${icon('chevron-down')}<span class="rx-grow"></span>${icon('mic')}<button type="button" class="rx-send cursor-interaction" data-action="send" aria-label="Send message">${icon('arrow-up')}</button></div></div>`;}
  function chatPane(s,context='home'){
    const chosen=s.selected?item(s.selected):null;
    const text=context==='active'?'Help me put together the next client proposal.':context==='try'&&chosen?chosen.sample:'What should I focus on today?';
    let response=context==='active'?'I can help you shape the scope and write the proposal. People and Gmail are already available, so we can pull in the context from your client conversations.':context==='try'&&chosen?`You can use ${chosen.name} here. Tell me what you want to work on.`:'You have a design review this afternoon and two things worth finishing first. I’ve pulled them into your deck.';
    return `<section class="rx-chat"><div class="rx-pane-tabs"><button type="button" class="cursor-interaction" aria-pressed="true" data-action="chat-view">CHAT</button><button type="button" class="cursor-interaction" data-action="board">TASKS</button><button type="button" class="cursor-interaction" data-action="notes">NOTES</button><span class="rx-grow"></span>${ib('history','Chat history','recent')}</div><div class="rx-transcript"><div class="rx-user">${esc(text)}</div><div><div class="rx-speaker"><span class="rx-brand">Ri</span> Ri</div><p>${response}</p>${context==='active'?`<div class="rx-message-tools">${mark(item('people'),true)} People ${mark(item('gmail'),true)} Gmail</div><div class="rx-space"></div><p>Proposal writer can also help keep the structure and voice consistent across your proposals.</p>${btn('See Proposal writer '+icon('arrow-right'),'select','proposal')}`:''}<div class="rx-message-tools">${icon('copy')}${icon('rotate-ccw')}<span>Just now</span></div></div>${s.sent?`<div class="rx-user">${esc(s.sent)}</div><div><div class="rx-speaker"><span class="rx-brand">Ri</span> Ri</div><p>This is a preview conversation. In Ri, your agent would continue here using the additions you chose.</p></div>`:''}</div>${composer(s)}</section>`;
  }
  function home(s){return `<div class="rx-home-panes">${chatPane(s)}<section><div class="rx-pane-tabs"><button type="button" class="cursor-interaction" data-action="chat-view">CHAT</button><button type="button" class="cursor-interaction" aria-pressed="true" data-action="home-view">DECK</button><button type="button" class="cursor-interaction" data-action="notes">NOTES</button><span class="rx-grow"></span>${ib('plus','Create','create')}</div><div class="rx-home-content">${sectionTitle('Today')}<p class="rx-tiny">Monday, October 19</p>${['Finish the proposal outline','Prepare for the design review'].map((t,n)=>`<button type="button" class="rx-task cursor-interaction" data-action="task" data-id="${n}" data-done="${s.done.includes(String(n))}" style="width:100%"><span class="rx-task-check">${s.done.includes(String(n))?icon('check'):''}</span><span class="rx-task-name">${t}</span></button>`).join('')}<section class="rx-section">${sectionTitle('Your library','Manage','library')}${quick(s)}</section><section class="rx-home-discover">${s.selected?detail(s,item(s.selected),true):`${sectionTitle('Discover','Browse all','all')}${search(s,'Find something for your Ri')}<div class="rx-space"></div>${tiles(s,catalog.filter(i=>!has(s,i)),2)}`}</section></div></section></div>`;}
  function chatLayout(s){return `${head('Client proposal','Design · New chat',btn(icon('layout-grid')+' Browse','main','','rx-primary')+btn('Your library','library'),'message-circle')}<div class="rx-chat-workbench">${chatPane(s,'active')}<aside><div class="rx-page-head"><div class="rx-grow"><h1>Discover</h1><p>More ways to move this forward.</p></div>${ib('settings-2','Manage library','library')}</div><div class="rx-catalog-pane">${s.selected?detail(s,item(s.selected),true):`${search(s,'Find a tool or a way to work')}${filters(s)}<p class="rx-kicker" style="margin-bottom:12px">For this conversation</p>${tiles(s,[item('proposal'),item('slides'),item('research'),...catalog.filter(i=>!['proposal','slides','research'].includes(i.id))],3)}<section class="rx-section">${sectionTitle('Already available')}${own(s).filter(i=>active(s,i)).slice(0,2).map(i=>flat(s,i)).join('')}</section>`}</div></aside></div>`;}
  function appInterior(s,i,compact=false){

  }
  function preview(s){const i=item(s.selected||'finances');return `${head('Apps','Browse something. See what it can do.',btn('Your library','library')+btn(icon('plus')+' Add your own','create','','rx-primary'))}<div class="rx-browser-list"><section class="rx-browser-menu">${search(s,'Search the catalog')}${filters(s,['All','Added','Available'])}<div class="rx-browser-items">${matching(s).map(x=>`<button type="button" class="rx-browser-item cursor-interaction" data-action="select" data-id="${x.id}" aria-pressed="${x.id===i.id}">${mark(x)}<span>${x.name}<small>${stateLabel(s,x)}</small></span></button>`).join('')}</div>${!matching(s).length?'<p class="rx-empty">No matches.</p>':''}</section><section class="rx-preview-main">${s.panel==='manage'?detail(s,i,true):`<div class="rx-preview-header">${mark(i)}<div class="rx-grow"><h2>${i.name}</h2><p class="rx-tiny">${i.description}</p></div><div class="rx-head-actions">${primary(s,i,'rx-primary')}${has(s,i)?ib('settings-2','Manage '+i.name,'manage',i.id):''}</div></div><div class="rx-preview-window">${i.kind==='app'?appInterior(s,i):`<div class="rx-app-tabs"><span class="rx-active">Example in chat</span></div><div class="rx-transcript"><div class="rx-user">${i.sample}</div><div><div class="rx-speaker"><span class="rx-brand">Ri</span> Ri</div><p>${i.id==='gmail'?'Maya asked for the revised scope by Thursday. Here is a draft that confirms the timeline and explains the next step.':i.kind==='skill'?'I’ll use your preferred workflow. First, we’ll gather the context, then shape the result together.':'I can bring this information into the work we’re doing here.'}</p></div></div>`}</div><div class="rx-preview-points"><span>${icon('message-circle')}Works in chat</span>${i.kind==='app'?`<span>${icon('layout-grid')}Opens in Ri</span>`:''}<span>${icon('settings-2')}Your settings</span></div><p class="rx-detail-copy">${i.detail}</p>`}</section></div>`;}
  function bundleLayout(s){const b=bundles.find(b=>b.id===s.bundle)||bundles[0];return `${head('Apps','Start with what you want to do.')}<div class="rx-page">${search(s)}${s.query||s.all?`${filters(s)}${tiles(s)}`:`<h2 style="margin-top:22px">What would make your day easier?</h2><div class="rx-bundle-grid">${bundles.map(b=>`<button type="button" class="rx-bundle cursor-interaction" data-action="bundle" data-id="${b.id}" aria-pressed="${s.bundle===b.id}"><span class="rx-mark">${icon(b.icon)}</span><span><h3>${b.name}</h3><p>${b.description}</p></span><div class="rx-bundle-icons">${b.items.map(id=>mark(item(id),true)).join('')}</div></button>`).join('')}</div><div class="rx-bundle-detail"><div class="rx-section-title"><h2>${b.name}</h2><span class="rx-tiny">${b.items.filter(id=>s.added.includes(id)).length} of ${b.items.length} already added</span></div><p class="rx-tiny">${b.copy}</p>${b.items.map(id=>flat(s,item(id))).join('')}<div class="rx-space"></div>${btn(b.items.every(id=>s.added.includes(id))?'Open your library':'Add what’s missing',b.items.every(id=>s.added.includes(id))?'library':'add-bundle',b.id,'rx-primary')}</div><div class="rx-foot-link">${btn('Browse everything '+icon('arrow-right'),'all','','rx-quiet')}${btn('Your library · '+s.added.length,'library','','rx-quiet')}</div>`}</div>`;}
  function tabDock(s){return `<nav class="rx-tab-dock" aria-label="Open apps"><button type="button" class="cursor-interaction" data-action="dock" data-id="discover" aria-pressed="${s.dock==='discover'}">${icon('compass')}Discover</button>${s.openTabs.filter(id=>s.added.includes(id)).map(id=>`<button type="button" class="cursor-interaction" data-action="dock" data-id="${id}" aria-pressed="${s.dock===id}">${mark(item(id),true)}${item(id).name}</button>`).join('')}<span class="rx-grow"></span><button type="button" class="cursor-interaction" data-action="library" aria-label="Your library">${icon('library')}<span>All added</span></button></nav>`;}
  function tabs(s){return `${tabDock(s)}${s.dock!=='discover'?`${head(item(s.dock).name,item(s.dock).description,btn(icon('settings-2')+' Manage','manage',s.dock)+btn(icon('message-circle')+' Chat','try',s.dock),item(s.dock).icon)}${appInterior(s,item(s.dock))}`:`${head('Discover','Find something useful, then open it alongside your work.')}<div class="rx-page">${search(s)}${filters(s)}${sectionTitle('For your next idea')}${tiles(s,catalog.filter(i=>!has(s,i)),6)}<section class="rx-section">${sectionTitle('Already yours','Manage','library')}${quick(s)}</section></div>`}`;}
  function control(s){return `${head('Apps','See what Ri can use. Add what’s missing.')}<div class="rx-control-center"><section class="rx-owned-pane">${sectionTitle('Available to Ri','','',s.added.length)}<div class="rx-table-head"><span>Name</span><span>On</span><span></span></div>${own(s).map(i=>`<div class="rx-table-row"><button type="button" class="rx-table-name cursor-interaction" data-action="${i.kind==='app'?'open':'try'}" data-id="${i.id}">${mark(i,true)}<span>${i.name}<small>${i.kind==='connection'?'Work account':i.kind==='mcp'?'Custom connection':i.kind==='app'?'Open app':'Use in chat'}</small></span></button>${toggle(active(s,i),'toggle',i.id,'Allow Ri to use '+i.name)}${ib('settings-2','Manage '+i.name,'manage',i.id)}</div>`).join('')}<p class="rx-tiny" style="margin-top:16px">Turn something off without losing its setup.</p><div class="rx-space"></div>${btn(icon('plus')+' Add your own','create','','rx-quiet')}</section><section class="rx-catalog-pane">${s.selected?detail(s,item(s.selected),true):`${sectionTitle('Discover')}${search(s,'Search for something new')}${filters(s)}${tiles(s,catalog.filter(i=>!has(s,i)),4)}`}</section></div>`;}
  function agent(s){return `<div class="rx-agent-banner"><span class="rx-avatar">D</span><div class="rx-grow"><h2>Design</h2><p class="rx-tiny">Help shape ideas and make them real.</p></div>${btn(icon('plus')+' New chat','new-chat','','rx-primary')}</div><div class="rx-pane-tabs"><button type="button" class="cursor-interaction" data-action="chat-view">CHATS</button><button type="button" class="cursor-interaction" data-action="agent-view" aria-pressed="true">TOOLS</button><button type="button" class="cursor-interaction" data-action="agent-instructions">INSTRUCTIONS</button></div><div class="rx-agent-tools"><section class="rx-owned-pane">${sectionTitle('Design can use')}<p class="rx-tiny">Choose what belongs in this agent’s work.</p>${catalog.filter(i=>s.agentTools.includes(i.id)&&has(s,i)).map(i=>`<div class="rx-owned-row"><span>${mark(i,true)}</span><div class="rx-grow"><h3>${i.name}</h3><span class="rx-tiny">${stateLabel(s,i)}</span></div>${toggle(true,'agent-toggle',i.id,'Use '+i.name+' with Design')}${ib('settings-2','Manage '+i.name,'manage',i.id)}</div>`).join('')}<div class="rx-space"></div><p class="rx-kicker">Agent instructions</p><p class="rx-instructions" style="margin-top:10px">Start from the user’s goal. Explore different directions before narrowing the answer.</p><div class="rx-space"></div>${btn('All of Ri’s additions','library','','rx-quiet')}</section><section class="rx-catalog-pane">${s.selected?detail(s,item(s.selected),true):`${sectionTitle('Discover for Design')}${search(s,'Find something this agent can use')}${filters(s)}<div class="rx-scope-note">${icon('bot')}<span>Add to Ri, then choose whether Design can use it.</span></div>${tiles(s,[item('proposal'),item('slides'),item('research'),item('linear'),item('people'),item('gmail')],4)}`}</section></div>`;}
  function shelf(s){return `${head('Finances','Your money, in one clear picture.',btn(icon('settings-2')+' Manage','manage','finances')+btn('Your library','library'),'wallet-cards')}<div class="rx-app-tabs"><span class="rx-active">Overview</span><span>Transactions</span><span>Recurring</span><span>Accounts</span></div><div class="rx-shelf-top"><div><span class="rx-tiny">Spent this month</span><div class="rx-balance">$2,840<span style="font-size:15px;letter-spacing:0;color:var(--rx-muted)">.00</span></div><div class="rx-bar"><span style="width:64%"></span></div><p class="rx-tiny">$1,160 left in your monthly plan</p><div class="rx-data-row">Subscriptions<strong>$86.00</strong></div><div class="rx-data-row">Food and groceries<strong>$428.00</strong></div></div><div class="rx-shelf-insight"><div class="rx-speaker"><span class="rx-brand">Ri</span> Ri</div><p>You have three subscriptions renewing next week. Want to review them together?</p>${btn('Review with Ri','try','finances')}</div></div><section class="rx-shelf">${s.selected?detail(s,item(s.selected),true):`${sectionTitle('Discover more for your Ri','Browse all','all')}${search(s,'Find an app, service, or way of working')}${filters(s)}<div class="rx-shelf-grid">${matching(s,s.all||s.query?catalog:[item('calendar'),item('travel'),item('weekly')]).map(i=>card(s,i)).join('')}</div>${!matching(s,s.all||s.query?catalog:[item('calendar'),item('travel'),item('weekly')]).length?'<p class="rx-empty">No matches.</p>':''}`}</section>`;}
  function detailBody(s,i){const isAdded=has(s,i);return `<div class="rx-detail-lead">${mark(i)}<div><h2>${i.name}</h2><span class="rx-tiny">${stateLabel(s,i)}</span></div>${ib('x','Close details','close-detail')}</div><p class="rx-detail-copy">${i.detail}</p><div class="rx-detail-actions">${primary(s,i,'rx-primary')}${isAdded&&i.kind==='app'?btn(icon('message-circle')+' Try in chat','try',i.id):''}</div>${isAdded?`<div class="rx-settings-row"><span>Available to Ri<small>Turning this off keeps your setup.</small></span>${toggle(active(s,i),'toggle',i.id,'Allow Ri to use '+i.name)}</div><div class="rx-settings-row"><span>Keep handy<small>Show ${i.name} in your shortcuts.</small></span>${toggle(s.pinned.includes(i.id),'pin',i.id,'Keep '+i.name+' handy')}</div>${s.scope==='Design'&&s.key==='agent'?`<div class="rx-settings-row"><span>Use with Design<small>Available to this agent.</small></span>${toggle(s.agentTools.includes(i.id),'agent-toggle',i.id,'Use '+i.name+' with Design')}</div>`:''}${i.kind==='connection'?`<div class="rx-settings-row"><span>Connected account<small>alex@example.com · Work</small></span>${btn('Change','account',i.id)}</div><label class="rx-field">Ri can<select data-field="access"><option${s.access==='Ask before making changes'?' selected':''}>Ask before making changes</option><option${s.access==='Only read information'?' selected':''}>Only read information</option></select></label>`:i.kind==='mcp'?`<label class="rx-field">Server address<input data-field="server" value="https://data.example.com/mcp" aria-label="Server address"></label><p class="rx-tiny">Custom MCP · 8 tools available</p>`:i.kind==='skill'?`<label class="rx-field">Your instructions<textarea data-field="instructions" rows="3">${esc(s.instructions)}</textarea></label>${btn(icon('pencil')+' Edit workflow','edit-skill',i.id)}`:i.id==='finances'?`<label class="rx-field">Currency<select data-field="currency"><option value="USD"${s.currency==='USD'?' selected':''}>US Dollar (USD)</option><option value="EUR"${s.currency==='EUR'?' selected':''}>Euro (EUR)</option></select></label>`:''}<div class="rx-space"></div>${btn('Remove from Ri','remove',i.id,'rx-quiet rx-danger')}${s.confirm?`<div class="rx-confirm">Remove ${i.name} from this preview? You can add it again from Discover.<div class="rx-inline">${btn('Remove','confirm-remove',i.id,'rx-danger')}${btn('Keep it','cancel-remove')}</div></div>`:''}`:`<div class="rx-settings-row"><span>What happens when you add it<small>${i.kind==='connection'?'Connect an account, then choose what Ri can do.':i.kind==='app'?'Open it in Ri or use it through a conversation.':'This way of working becomes available to Ri.'}</small></span></div><p class="rx-tiny">You can change its settings or remove it whenever you want.</p>`}`;}
  function detail(s,i,embedded=false){return `<div class="rx-detail"${embedded?' style="padding:0"':''}><button type="button" class="rx-back cursor-interaction" data-action="close-detail">${icon('arrow-left')}Back to browsing</button>${detailBody(s,i)}</div>`;}
  function library(s){return `${head('Your library',`${s.added.length} additions, ready wherever you work.`,btn(icon('compass')+' Discover','main','','rx-primary')+btn(icon('plus')+' Add your own','create'))}<div class="rx-page">${search(s,'Search your library')}${filters(s,['All','Work','Life','Create'])}${tiles(s,own(s),99)}</div>`;}
  function openApp(s){const i=item(s.selected);return `${head(i.name,i.description,btn(icon('arrow-left')+' Apps','main','','rx-quiet')+btn(icon('settings-2')+' Manage','manage',i.id)+btn(icon('message-circle')+' Chat','try',i.id),i.icon)}${appInterior(s,i)}`;}
  function create(s){return `${head('Add your own','Make Ri work your way.',btn(icon('arrow-left')+' Apps','main','','rx-quiet'),'plus')}<div class="rx-create"><h2>What would you like to add?</h2><div class="rx-create-options">${[['build','hammer','Build with Ri'],['import','upload','Import'],['mcp','server','Connect MCP']].map(x=>`<button type="button" class="cursor-interaction" data-action="create-mode" data-id="${x[0]}" aria-pressed="${s.createMode===x[0]}">${icon(x[1])}${x[2]}</button>`).join('')}</div>${s.createMode==='build'?`<label class="rx-field">What should Ri help you do?<textarea data-field="buildPrompt" rows="5" placeholder="A tracker for my subscriptions, or a workflow for writing in my voice…"></textarea></label>${btn('Start building','start-build','','rx-primary')}`:s.createMode==='mcp'?`<label class="rx-field">Name<input data-field="customName" placeholder="Company data"></label><label class="rx-field">Server address<input data-field="customUrl" type="url" placeholder="https://example.com/mcp"></label>${btn('Connect','connect-custom','','rx-primary')}`:`<label class="rx-field">Choose a skill or app package<input type="file" data-field="importFile" accept=".zip,.gz,.tgz,.md"></label><p class="rx-tiny">Review its details before adding it to Ri.</p>`}</div>`;}
  const layouts={discover,split,rail:railLayout,collection,home,chat:chatLayout,preview,bundles:bundleLayout,tabs,control,agent,shelf};
  function render(app){
    const key=app.dataset.layout,s=states[key];s.key=key;
    app.dataset.density=s.density;app.dataset.descriptions=String(s.descriptions);
    let body;
    if(s.view==='library')body=library(s);
    else if(s.view==='detail')body=head('Apps','More ways to work with Ri.',btn(icon('arrow-left')+' Browse','main','','rx-quiet'))+detail(s,item(s.selected));
    else if(s.view==='open')body=openApp(s);
    else if(s.view==='create')body=create(s);
    else if(s.view==='chat')body=head('Chat with Ri',s.selected?`Using ${item(s.selected).name}`:'A place to think and work.',btn('Browse additions','main'))+chatPane(s,'try');
    else if(s.view==='home')body=home(s);
    else if(s.view==='agent')body=agent(s);
    else if(s.view==='board')body=head('Task Board','Your work, at a glance.',btn('Browse additions','main'),'square-kanban')+`<div class="rx-page">${sectionTitle('Today')}${['Finish the proposal outline','Review the launch plan','Follow up with Maya'].map((t,n)=>`<button type="button" class="rx-task cursor-interaction" data-action="task" data-id="${n}" data-done="${s.done.includes(String(n))}" style="width:100%"><span class="rx-task-check">${s.done.includes(String(n))?icon('check'):''}</span><span class="rx-task-name">${t}</span></button>`).join('')}</div>`;
    else body=layouts[key](s);
    app.innerHTML=`${hud(key)}<div class="rx-shell${s.railOpen?'':' rx-collapsed'}">${rail(s,key)}<main class="rx-work">${s.notice?`<div class="rx-notice" role="status">${icon('check')}<span>${esc(s.notice)}</span>${ib('x','Dismiss message','dismiss')}</div>`:''}${body}</main></div><nav class="rx-phone-nav" aria-label="Ri mobile navigation"><button type="button" class="cursor-interaction" data-action="home-view">${icon('message-circle')}Ri</button><button type="button" class="cursor-interaction" data-action="board">${icon('square-kanban')}Tasks</button><button type="button" class="cursor-interaction" data-action="main" aria-current="page">${icon('layout-grid')}Apps</button><button type="button" class="cursor-interaction" data-action="agent-view">${icon('bot')}Agents</button><button type="button" class="cursor-interaction" data-action="create">${icon('plus')}Create</button></nav>`;
    app.querySelectorAll('[data-field="currency"]').forEach(el=>el.setAttribute('aria-label','Currency'));
    app.querySelectorAll('[data-field="access"]').forEach(el=>el.setAttribute('aria-label','Ri can'));
    if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});
  }
  function save(){
    const compact={};
    for(const [key,s] of Object.entries(states)){compact[key]={};for(const field of ['view','selected','query','filter','all','added','off','pinned','bundle','dock','openTabs','scope','agentTools','currency','access','instructions','density','descriptions','railOpen'])compact[key][field]=s[field];}
    const snapshot={modelContent:{concepts:allRoots.map(app=>app.getAttribute('aria-label'))},privateContent:{version:4,layouts:compact}};
    const serialized=JSON.stringify(snapshot);if(serialized===lastSaved)return;lastSaved=serialized;
    window.openai?.setWidgetState?.(snapshot)?.catch(()=>{});
  }
  const embedded=new Set(['split','home','chat','control','agent','shelf']);
  function select(s,key,id,manage=false){s.selected=id;s.panel=manage?'manage':'overview';s.confirm=false;if(key==='preview'||key==='collection'||embedded.has(key)){s.view='main';}else{s.view='detail';}}
  function closeDetails(s,key){s.selected=key==='preview'?(s.selected||'finances'):null;s.panel='overview';s.confirm=false;s.view='main';}
  function add(s,id){if(!s.added.includes(id))s.added.push(id);s.off=s.off.filter(x=>x!==id);const i=item(id);s.notice=i.kind==='connection'?`${i.name} connected to a sample account.`:`${i.name} added to this preview.`;}
  function perform(app,action,id,button){
    const key=app.dataset.layout,s=states[key],i=item(id);s.notice='';
    if(action==='main'){s.view='main';s.query='';s.filter='All';s.all=false;s.dock='discover';closeDetails(s,key);}
    else if(action==='library'){s.view='library';s.query='';s.filter='All';s.selected=null;}
    else if(action==='select'||action==='manage'){select(s,key,id,action==='manage');}
    else if(action==='close-detail'){closeDetails(s,key);}
    else if(action==='add'){add(s,id);}
    else if(action==='toggle'){if(!s.added.includes(id))add(s,id);else if(s.off.includes(id))s.off=s.off.filter(x=>x!==id);else s.off.push(id);}
    else if(action==='pin'){s.pinned=s.pinned.includes(id)?s.pinned.filter(x=>x!==id):[...s.pinned,id];s.notice=s.pinned.includes(id)?`${i.name} kept in your shortcuts.`:`${i.name} removed from shortcuts.`;}
    else if(action==='open'){if(!active(s,i)){select(s,key,id,true);}else if(key==='tabs'){s.view='main';s.dock=id;if(!s.openTabs.includes(id))s.openTabs.push(id);}else{s.view='open';s.selected=id;}}
    else if(action==='try'){if(!active(s,i)){select(s,key,id,true);}else{s.view='chat';s.selected=id;s.draft=i.sample;s.sent='';}}
    else if(action==='remove'){s.confirm=true;}
    else if(action==='cancel-remove'){s.confirm=false;}
    else if(action==='confirm-remove'){s.added=s.added.filter(x=>x!==id);s.pinned=s.pinned.filter(x=>x!==id);s.off=s.off.filter(x=>x!==id);s.openTabs=s.openTabs.filter(x=>x!==id);s.confirm=false;s.notice=`${i.name} removed from this preview.`;s.dock='discover';}
    else if(action==='filter'){s.filter=id;s.selected=key==='preview'?s.selected:null;}
    else if(action==='all'){s.all=true;s.query='';s.filter='All';s.selected=key==='preview'?s.selected:null;}
    else if(action==='clear'){s.query='';}
    else if(action==='bundle'){s.bundle=id;}
    else if(action==='add-bundle'){const b=bundles.find(b=>b.id===id);if(b){b.items.forEach(id=>add(s,id));s.notice=`${b.name} is ready in this preview.`;}}
    else if(action==='dock'){s.dock=id;s.view='main';s.selected=null;}
    else if(action==='agent-toggle'){s.agentTools=s.agentTools.includes(id)?s.agentTools.filter(x=>x!==id):[...s.agentTools,id];}
    else if(action==='create'){s.view='create';}
    else if(action==='create-mode'){s.createMode=id;}
    else if(action==='connect-custom'){const address=app.querySelector('[data-field="customUrl"]')?.value||'';if(!/^https?:\/\/.+/.test(address)){s.notice='Enter a server address, such as https://example.com/mcp.';}else{add(s,'company');select(s,key,'company',true);s.notice='Sample custom connection added. No server was contacted.';}}
    else if(action==='start-build'){const prompt=app.querySelector('[data-field="buildPrompt"]')?.value?.trim();if(!prompt){s.notice='Describe what you would like to build.';}else{s.view='chat';s.selected=null;s.draft=prompt;s.notice='Your idea is ready in the preview chat.';}}
    else if(action==='send'){if(s.draft.trim()){s.sent=s.draft.trim();s.draft='';}}
    else if(action==='dismiss'){s.notice='';}
    else if(action==='rail-toggle'){s.railOpen=!s.railOpen;}
    else if(action==='home-view'){s.view=key==='home'?'main':'home';s.selected=null;}
    else if(action==='agent-view'){s.view=key==='agent'?'main':'agent';s.selected=null;}
    else if(action==='new-chat'||action==='chat-view'){s.view='chat';s.selected=null;s.draft='';s.sent='';}
    else if(action==='board'){s.view='board';}
    else if(action==='task'){s.done=s.done.includes(id)?s.done.filter(x=>x!==id):[...s.done,id];}
    else if(action==='accounts'){s.view='library';s.filter='All';s.query='account';}
    else if(action==='settings'){s.view='library';s.filter='All';s.query='';s.notice='Choose an addition’s settings to manage it.';}
    else if(action==='edit-skill'){s.view='chat';s.selected=id;s.draft='Help me customize '+i.name+'.';}
    else if(action==='account'){s.notice='Account settings preview: Work account, alex@example.com.';}
    else if(action==='global-search'||action==='search-chats'){s.view='main';s.selected=null;s.notice='Search additions by name or by what you want to do.';}
    else if(action==='demo-person'){s.notice='People preview: a new person would open in an editor here.';}
    else if(action==='trip-day'){s.notice=id+' itinerary selected in the preview.';}
    else if(action==='agent-instructions'){s.notice='Design: Start from the user’s goal. Explore different directions before narrowing the answer.';}
    else if(action==='recent'){s.notice='Recent chats: Explore the next direction, Website review.';}
    else if(action==='new-agent'){s.notice='New agents would be created here. This preview focuses on additions.';}
    else if(action==='notes'){s.notice='Notes stay in your existing Ri view. Use Apps to continue this exploration.';}
    else if(action==='calendar-view'){s.notice='Design review at 2:00 PM. Calendar keeps its current place in the rail.';}
    else if(action==='schedules'){s.notice='Schedules and Triggers keeps its current place in the rail.';}
    else if(action==='attach'){s.notice='Attachments work through the existing chat composer.';}
    render(app);save();measure();
    if(['select','manage','library','open','create'].includes(action)){const focus=app.querySelector('.rx-work .rx-back, .rx-work button');if(focus)focus.focus({preventScroll:true});}
  }
  allRoots.forEach(app=>{
    app.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(b&&app.contains(b))perform(app,b.dataset.action,b.dataset.id||'',b);});
    app.addEventListener('input',event=>{
      const field=event.target.dataset.field;if(!field)return;
      const s=states[app.dataset.layout];
      if(field==='query'){
        const pos=event.target.selectionStart;s.query=event.target.value;render(app);
        const input=app.querySelector('[data-field="query"]');if(input){input.focus({preventScroll:true});try{input.setSelectionRange(pos,pos);}catch{}}
        save();measure();
      }else if(['draft','instructions'].includes(field)){s[field]=event.target.value;}
    });
    app.addEventListener('change',event=>{const field=event.target.dataset.field;const s=states[app.dataset.layout];if(['currency','access'].includes(field)){s[field]=event.target.value;save();}if(field==='importFile'&&event.target.files?.length){s.notice=`${event.target.files[0].name} selected for this preview. Nothing was uploaded.`;render(app);measure();}});
    render(app);
    if(globalThis.Tweak){const s=states[app.dataset.layout];const tweak=new Tweak({container:app,onChange:()=>{render(app);save();measure();}});tweak.addSelect(s,'density',{label:'Spacing',options:['Comfortable','Compact']});tweak.addToggle(s,'descriptions',{label:'Show descriptions'});tweak.addToggle(s,'railOpen',{label:'Expanded agent rail'});}
  });
  let measuring=false,lastWidth=0;
  function measure(){
    if(measuring)return;measuring=true;
    requestAnimationFrame(()=>{
      const sections=[...root.children].filter(e=>e.hasAttribute('data-variant'));
      const hidden=sections.map(e=>e.hidden);
      let height=840;
      for(const [index,section] of sections.entries()){
        section.hidden=false;
        const app=section.querySelector('.rx-app');app.style.minHeight='840px';
        height=Math.max(height,Math.ceil(app.getBoundingClientRect().height));
        section.hidden=hidden[index];
      }
      allRoots.forEach(app=>{app.style.minHeight=height+'px';app.parentElement.style.minHeight=height+'px';});
      measuring=false;
    });
  }
  const observer=new ResizeObserver(entries=>{const width=Math.round(entries[0].contentRect.width);if(width!==lastWidth){lastWidth=width;measure();}});observer.observe(root);
  document.fonts?.ready.then(measure);
  window.addEventListener('openai:set_globals',event=>{
    const saved=event.detail?.globals?.widgetState;if(!saved)return;
    const serialized=JSON.stringify(saved);if(serialized===lastSaved)return;lastSaved=serialized;
    hydrate(saved);allRoots.forEach(render);measure();
  });
  measure();
})();
</script>
