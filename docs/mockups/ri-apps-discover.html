<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ri · Discover</title>
<style>
:root { color-scheme:light dark; }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body { background:light-dark(#fff,#09090b); }
button,input,textarea,select { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.45; }
button:focus-visible,a:focus-visible { outline:2px solid light-dark(#71717a,#d4d4d8); outline-offset:3px; }
[hidden] { display:none!important; }
#ri {
  --bg:light-dark(#fff,#09090b); --fg:light-dark(#18181b,#fafafa);
  --soft:light-dark(#f4f4f5,#18181b); --card:light-dark(#fff,#111113);
  --muted:light-dark(#71717a,#a1a1aa); --line:light-dark(#e4e4e7,#27272a);
  --strong:light-dark(#27272a,#e4e4e7); --on:light-dark(#fafafa,#18181b);
  --green:light-dark(#15803d,#4ade80); --amber:light-dark(#a16207,#eab308);
  --blue:light-dark(#2563eb,#60a5fa); --red:light-dark(#b91c1c,#f87171);
  font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  height:100dvh; min-height:560px; display:flex; flex-direction:column;
  background:var(--bg); color:var(--fg); isolation:isolate;
}
#ri :is(h1,h2,h3,p) { margin:0; }
#ri h1 { font-size:13px; font-weight:600; }
#ri h2 { font-size:19px; line-height:1.35; letter-spacing:-.4px; font-weight:600; }
#ri h3 { font-size:13px; line-height:1.5; font-weight:600; }
#ri button { border:0; background:none; color:inherit; padding:0; text-align:left; }
#ri svg { width:15px; height:15px; stroke-width:1.6; flex-shrink:0; vertical-align:middle; }
#ri input,#ri textarea,#ri select { color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:9px 10px; width:100%; min-width:0; }
#ri textarea { resize:vertical; }
#ri input::placeholder,#ri textarea::placeholder { color:var(--muted); opacity:1; }
#ri .muted { color:var(--muted); }
#ri .small { font-size:11px; color:var(--muted); }
#ri .kicker { font-size:10px; letter-spacing:.09em; font-weight:600; color:var(--muted); text-transform:uppercase; }
#ri .grow { flex:1; min-width:0; }
#ri .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
#ri .stack { display:flex; flex-direction:column; gap:12px; }
#ri .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:29px; padding:5px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); font-size:11px; font-weight:500; white-space:nowrap; }
#ri .btn:hover { background:var(--soft); }
#ri .primary { color:var(--on); background:var(--strong); border-color:var(--strong); font-weight:600; }
#ri .primary:hover { color:var(--on); background:var(--strong); opacity:.9; }
#ri .quiet { color:var(--muted); background:transparent; border-color:transparent; }
#ri .danger { color:var(--red); }
#ri .icon-button { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:6px; color:var(--muted); flex-shrink:0; }
#ri .icon-button:hover { color:var(--fg); background:var(--soft); }
#ri .mark { width:34px; height:34px; border-radius:9px; background:var(--soft); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
#ri .mark svg { width:18px; height:18px; }
#ri .mark.sm { width:24px; height:24px; border-radius:6px; }
#ri .mark.sm svg { width:13px; height:13px; }
#ri .mark[data-tone="green"] { color:light-dark(#277553,#80c6a2); background:light-dark(#eef7f0,#18281f); }
#ri .mark[data-tone="blue"] { color:light-dark(#366db9,#92b8e4); background:light-dark(#eef4fc,#192332); }
#ri .mark[data-tone="red"] { color:light-dark(#bd5951,#db918b); background:light-dark(#fff0ee,#2b1c1d); }
#ri .mark[data-tone="purple"] { color:light-dark(#73559d,#c5a5eb); background:light-dark(#f5f0fa,#251e30); }
#ri .mark[data-tone="gold"] { color:light-dark(#a77732,#d0b17d); background:light-dark(#faf5eb,#2a241b); }
#ri .brand { width:22px; height:22px; border-radius:50%; background:var(--strong); color:var(--on); display:inline-grid; place-items:center; font-weight:700; font-size:12px; letter-spacing:-1px; flex-shrink:0; }
#ri .hud { height:40px; flex-shrink:0; display:flex; align-items:center; gap:15px; padding:0 16px; border-bottom:1px solid var(--line); }
#ri .statuses { display:flex; align-items:center; gap:11px; font-size:10px; color:var(--muted); }
#ri .statuses span { display:inline-flex; align-items:center; gap:4px; }
#ri .statuses svg { width:11px; height:11px; }
#ri .statuses span:nth-child(-n+2) { color:var(--amber); }
#ri .statuses span:nth-child(3) { color:var(--green); }
#ri .hud .btn { min-height:25px; padding:3px 9px; font-size:10px; border-radius:15px; }
#ri .event { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted); }
#ri .shell { display:grid; grid-template-columns:256px minmax(0,1fr); flex:1; min-height:0; }
#ri .rail { display:flex; flex-direction:column; border-right:1px solid var(--line); padding:8px; min-height:0; }
#ri .rail-home { display:flex; align-items:center; gap:8px; padding:3px 5px 12px; }
#ri .rail-home .name { font-size:13px; font-weight:600; }
#ri .nav-item { display:flex; align-items:center; gap:9px; min-height:32px; padding:7px 8px; border-radius:7px; color:var(--muted); font-size:12px; width:100%; }
#ri .nav-item:hover,#ri .nav-item[aria-current="page"] { color:var(--fg); background:var(--soft); }
#ri .nav-item .chevron { margin-left:auto; }
#ri .rule { height:1px; background:var(--line); margin:10px 5px; }
#ri .rail-list { overflow:auto; min-height:0; }
#ri .rail-group { display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding:12px 5px 8px; margin-bottom:5px; }
#ri .rail-group span { font-size:9px; letter-spacing:.1em; font-weight:600; }
#ri .agent-row { display:flex; align-items:center; gap:7px; padding:9px 5px 5px; font-weight:500; font-size:12px; }
#ri .avatar { width:20px; height:20px; border-radius:4px; background:var(--soft); display:inline-grid; place-items:center; font-weight:600; font-size:9px; flex-shrink:0; }
#ri .chat-link { display:flex; align-items:center; gap:7px; padding:7px 6px 7px 33px; width:100%; color:var(--muted); font-size:11px; border-radius:5px; }
#ri .chat-link:hover { background:var(--soft); }
#ri .dot { width:5px; height:5px; border-radius:50%; background:var(--green); flex-shrink:0; }
#ri .rail-bottom { margin-top:auto; padding-top:16px; }
#ri .accounts { border:1px solid var(--line); margin-top:5px; border-radius:6px; }
#ri .prototype-footer { display:flex; align-items:center; gap:8px; padding:12px 8px 4px; font-size:10px; color:var(--muted); }
#ri .prototype-footer button { text-decoration:underline; text-underline-offset:3px; font-size:10px; }
#ri .main { display:flex; flex-direction:column; min-width:0; min-height:0; }
#ri .page-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); min-height:54px; flex-shrink:0; }
#ri .page-head p { margin-top:1px; color:var(--muted); font-size:10.5px; }
#ri .notice { display:flex; align-items:center; gap:8px; padding:8px 16px; background:var(--soft); border-bottom:1px solid var(--line); font-size:11px; flex-shrink:0; }
#ri .notice span { flex:1; }
#ri .browser { display:grid; grid-template-columns:minmax(0,1fr); flex:1; min-height:0; min-width:0; }
#ri .browser.with-inspector { grid-template-columns:minmax(0,1fr) 390px; }
#ri .catalog-scroll { overflow-y:auto; padding:24px 28px 32px; min-width:0; scroll-behavior:auto; }
#ri .catalog-inner { max-width:1120px; margin:0 auto; }
#ri .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
#ri .section-title h2 { font-size:13px; letter-spacing:0; }
#ri .count { font-size:11px; color:var(--muted); font-weight:400; margin-left:6px; }
#ri .shortcuts { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
#ri .shortcut { display:flex; align-items:center; gap:8px; border-radius:7px; background:var(--soft); padding:9px 12px; font-size:11px; font-weight:500; min-width:130px; flex:1; max-width:210px; }
#ri .shortcut:hover { box-shadow:inset 0 0 0 1px var(--line); }
#ri .discover-heading { display:flex; align-items:center; gap:10px; margin:30px 0 16px; }
#ri .discover-heading p { font-size:12px; color:var(--muted); margin-top:4px; }
#ri .search { display:flex; align-items:center; gap:9px; padding:0 11px; min-height:39px; border:1px solid var(--line); border-radius:8px; background:var(--soft); }
#ri .search svg { color:var(--muted); }
#ri .search input { border:0; border-radius:4px; background:transparent; padding:9px 0; font-size:12px; }
#ri .filters { display:flex; gap:4px; flex-wrap:wrap; margin:12px 0 20px; }
#ri .filter { font-size:11px; color:var(--muted); border:1px solid transparent; border-radius:20px; padding:4px 11px; }
#ri .filter[aria-pressed="true"],#ri .filter:hover { background:var(--soft); color:var(--fg); border-color:var(--line); }
#ri .collections { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:25px; }
#ri .collection { display:flex; align-items:flex-start; gap:10px; padding:15px 13px; background:var(--soft); border:1px solid var(--line); border-radius:9px; }
#ri .collection:hover { border-color:var(--muted); }
#ri .collection > svg { margin-top:3px; }
#ri .collection b { display:block; font-size:12px; font-weight:500; }
#ri .collection small { display:block; color:var(--muted); font-size:10.5px; margin-top:4px; line-height:1.6; }
#ri .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(225px,100%),1fr)); gap:12px; }
#ri .tile { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:16px; display:flex; flex-direction:column; min-width:0; gap:15px; }
#ri .tile.is-selected { border-color:var(--muted); background:var(--soft); }
#ri .tile:hover { border-color:var(--muted); }
#ri .tile-top { display:flex; align-items:flex-start; gap:11px; min-width:0; width:100%; }
#ri .tile-copy { flex:1; min-width:0; }
#ri .tile-name { display:block; font-size:13px; font-weight:600; }
#ri .tile-description { display:block; font-size:11px; line-height:1.7; color:var(--muted); margin-top:4px; }
#ri .tile-bottom { display:flex; gap:6px; align-items:center; margin-top:auto; flex-wrap:wrap; }
#ri .tile-status { display:flex; align-items:center; gap:4px; color:var(--muted); font-size:10px; flex:1; }
#ri .tile-status svg { width:11px; height:11px; }
#ri .empty { padding:30px 0; font-size:12px; color:var(--muted); }
#ri .bundle-intro { margin:18px 0; padding:16px; background:var(--soft); border-radius:9px; }
#ri .bundle-intro p { font-size:12px; color:var(--muted); margin:6px 0 13px; line-height:1.7; }
#ri .inspector { border-left:1px solid var(--line); background:var(--bg); padding:20px; min-width:0; overflow-y:auto; }
#ri .inspector-head { display:flex; align-items:center; gap:11px; margin:2px 0 15px; }
#ri .inspector-head .mark { width:42px; height:42px; border-radius:11px; }
#ri .inspector-head h2 { font-size:17px; }
#ri .inspector-description { font-size:12px; color:var(--muted); line-height:1.8; }
#ri .inspector-actions { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:17px 0; }
#ri .inspector-tabs { display:flex; align-items:center; gap:22px; border-bottom:1px solid var(--line); margin-bottom:20px; }
#ri .inspector-tabs button { padding:10px 0; font-size:11px; color:var(--muted); }
#ri .inspector-tabs button[aria-selected="true"] { color:var(--fg); box-shadow:inset 0 -2px var(--fg); }
#ri .preview { border:1px solid var(--line); border-radius:9px; background:var(--card); overflow:hidden; margin-top:16px; }
#ri .preview-bar { display:flex; align-items:center; gap:7px; font-size:10px; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); }
#ri .preview-bar .small { margin-left:auto; font-size:9px; }
#ri .preview-content { padding:17px; }
#ri .preview-content h3 { font-size:14px; }
#ri .preview-copy { margin:14px 0!important; font-size:11px; line-height:1.8; }
#ri .money { font-size:29px; font-weight:500; letter-spacing:-1px; line-height:1.4; margin:5px 0 14px; }
#ri .money small { font-size:14px; color:var(--muted); letter-spacing:0; }
#ri .bar { height:4px; background:var(--soft); border-radius:4px; margin:8px 0 13px; }
#ri .bar span { display:block; height:100%; width:64%; border-radius:4px; background:var(--green); }
#ri .data-row { display:flex; align-items:center; gap:9px; border-top:1px solid var(--line); padding:11px 0; font-size:11px; }
#ri .data-row strong { margin-left:auto; font-size:11px; font-weight:500; white-space:nowrap; }
#ri .capabilities { display:flex; flex-wrap:wrap; gap:10px 16px; font-size:10px; color:var(--muted); margin:18px 0; }
#ri .capabilities span { display:flex; align-items:center; gap:5px; }
#ri .capabilities svg { width:12px; height:12px; }
#ri .setting { display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding:16px 0; }
#ri .setting-copy { flex:1; font-size:12px; font-weight:500; }
#ri .setting-copy small { display:block; font-size:10.5px; color:var(--muted); font-weight:400; margin-top:3px; line-height:1.7; }
#ri .switch { position:relative; width:33px; min-width:33px; height:28px; display:flex; align-items:center; }
#ri .switch::before { content:""; position:absolute; width:31px; height:18px; top:5px; left:0; border-radius:12px; background:var(--line); }
#ri .switch span { position:absolute; width:14px; height:14px; border-radius:50%; background:var(--bg); top:7px; left:2px; box-shadow:0 1px 2px light-dark(#0002,#0006); }
#ri .switch[aria-checked="true"]::before { background:var(--strong); }
#ri .switch[aria-checked="true"] span { left:15px; background:var(--on); }
#ri .field { display:block; font-size:11px; margin:18px 0; }
#ri .field input,#ri .field select,#ri .field textarea { margin-top:7px; font-size:12px; }
#ri .remove-area { border-top:1px solid var(--line); padding-top:16px; margin-top:25px; }
#ri .confirm { padding:13px; border:1px solid var(--line); border-radius:8px; background:var(--soft); margin-top:10px; font-size:11px; line-height:1.8; }
#ri .confirm .row { margin-top:10px; }
#ri .surface { overflow:auto; flex:1; min-height:0; }
#ri .app-tabs { display:flex; gap:20px; padding:0 24px; border-bottom:1px solid var(--line); }
#ri .app-tabs button { padding:13px 0; font-size:11px; color:var(--muted); }
#ri .app-tabs button[aria-pressed="true"] { color:var(--fg); box-shadow:inset 0 -2px var(--fg); }
#ri .app-page { padding:30px; max-width:1100px; margin:0 auto; }
#ri .app-columns { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(210px,.65fr); gap:40px; }
#ri .app-page .money { font-size:42px; margin:8px 0; }
#ri .chart { display:flex; align-items:flex-end; height:150px; gap:9px; border-bottom:1px solid var(--line); margin:30px 0 6px; padding:0 6px; }
#ri .chart span { flex:1; background:color-mix(in srgb,var(--green) 32%,var(--bg)); border-radius:4px 4px 0 0; }
#ri .chart-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:24px; }
#ri .app-aside { border-left:1px solid var(--line); padding-left:26px; }
#ri .app-aside p { font-size:12px; line-height:1.8; color:var(--muted); margin:14px 0 18px; }
#ri .chat-page { display:flex; flex-direction:column; flex:1; min-height:0; }
#ri .transcript { overflow:auto; flex:1; padding:28px; }
#ri .transcript-inner { display:flex; flex-direction:column; gap:24px; max-width:720px; margin:0 auto; }
#ri .speaker { display:flex; align-items:center; gap:7px; font-size:10px; font-weight:600; margin-bottom:10px; }
#ri .chat-body { font-size:13px; line-height:1.85; }
#ri .user-message { align-self:flex-end; background:var(--strong); color:var(--on); padding:12px 15px; border-radius:13px 13px 2px 13px; max-width:85%; font-size:12px; }
#ri .composer { margin:15px auto 18px; padding:11px; border:1px solid var(--line); border-radius:12px; width:calc(100% - 48px); max-width:720px; background:var(--card); }
#ri .composer textarea { border:0; background:none; min-height:80px; padding:4px 2px; font-size:12px; }
#ri .composer-bottom { display:flex; gap:7px; align-items:center; font-size:10px; color:var(--muted); }
#ri .send { display:grid; place-items:center; width:27px; height:27px; border-radius:50%; background:var(--strong); color:var(--on); margin-left:auto; }
#ri .create-page { padding:32px 28px; max-width:580px; margin:auto; width:100%; }
#ri .create-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:22px 0; }
#ri .create-options button { display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:15px 8px; font-size:11px; }
#ri .create-options button[aria-pressed="true"] { border-color:var(--muted); background:var(--soft); }
#ri .mobile-header,#ri .mobile-nav { display:none; }
#ri .shell.collapsed { grid-template-columns:44px minmax(0,1fr); }
#ri .shell.collapsed .rail { padding:8px 4px; align-items:center; }
#ri .shell.collapsed :is(.rail .label,.rail .chevron,.rail .name,.rail .collapse,.rail-list,.prototype-footer) { display:none; }
#ri .shell.collapsed .rail-home { padding:3px 2px 11px; }
#ri .shell.collapsed .nav-item { justify-content:center; width:34px; padding:8px; }
#ri .shell.collapsed .rule { width:24px; margin:8px 0; }
#ri .shell.collapsed .accounts { border:0; }
@media (max-width:1200px) {
  #ri .browser.with-inspector { grid-template-columns:minmax(0,1fr) 350px; }
  #ri .with-inspector .collections { grid-template-columns:1fr; }
  #ri .with-inspector .collection { padding:11px 12px; }
  #ri .with-inspector .collection small { display:none; }
  #ri .shortcut { min-width:125px; }
  #ri .hud .event { display:none; }
}
@media (max-width:1000px) {
  #ri .shell { grid-template-columns:44px minmax(0,1fr); }
  #ri .rail { padding:8px 4px; align-items:center; }
  #ri :is(.rail .label,.rail .chevron,.rail .name,.rail .collapse,.rail-list,.prototype-footer) { display:none; }
  #ri .rail-home { padding:3px 2px 11px; }
  #ri .nav-item { justify-content:center; width:34px; padding:8px; }
  #ri .rule { width:24px; margin:8px 0; }
  #ri .accounts { border:0; }
  #ri .catalog-scroll { padding:22px; }
}
@media (max-width:760px) {
  #ri { height:auto; min-height:100dvh; }
  #ri .hud,#ri .rail { display:none; }
  #ri .shell,#ri .shell.collapsed { display:flex; flex-direction:column; flex:1; }
  #ri .mobile-header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:12px; }
  #ri .page-head { padding:10px 14px; }
  #ri .page-head > .grow { min-width:155px; }
  #ri .main { flex:1; }
  #ri .catalog-scroll { overflow:visible; padding:20px 16px; }
  #ri .browser,#ri .browser.with-inspector { display:flex; flex-direction:column; }
  #ri .inspector { order:-1; border-left:0; border-bottom:1px solid var(--line); padding:20px 16px; overflow:visible; }
  #ri .collections { grid-template-columns:1fr; }
  #ri .collection { padding:12px; }
  #ri .collection small { margin-top:2px; }
  #ri .shortcuts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  #ri .shortcut { min-width:0; max-width:none; font-size:11px; padding:9px; }
  #ri .tiles { grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr)); }
  #ri .discover-heading { margin-top:25px; }
  #ri .mobile-nav { display:flex; align-items:center; justify-content:space-around; gap:4px; border-top:1px solid var(--line); padding:10px 5px; margin-top:auto; }
  #ri .mobile-nav button { display:flex; flex-direction:column; align-items:center; gap:4px; padding:5px; font-size:10px; color:var(--muted); }
  #ri .mobile-nav button[aria-current="page"] { color:var(--fg); }
  #ri .app-page { padding:22px 16px; }
  #ri .app-columns { grid-template-columns:1fr; gap:25px; }
  #ri .app-aside { border-left:0; border-top:1px solid var(--line); padding:20px 0 0; }
  #ri .app-tabs { padding:0 16px; gap:17px; flex-wrap:wrap; }
  #ri .surface { overflow:visible; }
  #ri .transcript { padding:22px 16px; min-height:300px; }
  #ri .composer { width:calc(100% - 32px); }
  #ri .create-page { padding:24px 16px; }
}
@media (pointer:coarse) {
  #ri button { min-height:44px; }
  #ri .icon-button { min-width:44px; }
  #ri input,#ri textarea,#ri select { font-size:16px!important; }
  #ri .switch::before { top:13px; }
  #ri .switch span { top:15px; }
}
@media (prefers-reduced-motion:no-preference) {
  #ri .tile,#ri .collection,#ri .btn { transition:background .12s,border-color .12s; }
}
</style>

<script>

  const initialCatalog = [
    {id:'finances',name:'Finances',icon:'wallet-cards',tone:'green',kind:'app',group:'Life',description:'Your money, in one clear picture.',detail:'See spending, track recurring costs, and plan what comes next. Open the app or ask Ri about your money.',sample:'Help me review my subscriptions.',keywords:'money budget spending bills finances'},

  function hud(){return `<div class="hud"><div class="statuses"><span>${icon('circle-alert')}1</span><span>${icon('circle')}2</span><span>${icon('zap')}1</span><span>${icon('clock')}0</span>${icon('gauge')}</div>${btn(icon('x')+' Close apps','context','Home','quiet')}<span class="grow"></span><span class="event">${icon('calendar')}Design review in 24m</span>${ib('search','Search additions','search')}${ib(state.theme==='dark'?'sun':'moon','Switch appearance','theme')}${btn(icon('plus')+' CREATE','create','','primary')}</div><div class="mobile-header"><span class="brand">Ri</span><strong>Ri</strong><span class="grow"></span><span class="small">Prototype</span>${ib('sun-moon','Switch appearance','theme')}${ib('search','Search additions','search')}</div>`;}

  function shortLibrary(){const pinned=state.pinned.map(get).filter(enabled);return `<section aria-label="Your library shortcuts"><div class="section-title"><h2>Your library<span class="count">${state.added.length}</span></h2>${btn('View all '+icon('arrow-right'),'library','','quiet')}</div>${pinned.length?`<div class="shortcuts">${pinned.map(i=>`<button type="button" class="shortcut" data-action="${i.kind==='app'?'open':'try'}" data-id="${esc(i.id)}">${mark(i,true)}<span>${esc(i.name)}</span></button>`).join('')}</div>`:'<p class="small">Your favorite additions will be ready here.</p>'}</section>`;}
  function matches(i){const words=(state.query.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!['help','me','i','want','to','my','the','a','an','with','and','do','make','manage'].includes(w));const text=`${i.name} ${i.description} ${i.detail} ${i.kind} ${i.keywords||''}`.toLowerCase();return (!words.length||words.some(w=>text.includes(w.length>4?w.replace(/s$/,''):w)))&&(state.filter==='All'||state.filter===i.group);}

t></label>`:'<p class="small" style="margin-top:18px">Your preferences stay with this addition.</p>'}<div class="remove-area">${btn('Remove from Ri','remove',i.id,'quiet danger')}${confirmRemove?`<div class="confirm" role="alert">Remove ${esc(i.name)} from your library? You can add it again later.<div class="row">${btn('Keep it','cancel-remove')}${btn('Remove','confirm-remove',i.id,'danger')}</div></div>`:''}</div>`;}
  function inspector(){const i=get(state.selected);if(!i)return '';const added=isAdded(i),settings=state.detailTab==='settings'&&added;return `<aside class="inspector" aria-label="${esc(i.name)} details"><div class="inspector-head">${mark(i)}<div class="grow"><h2>${esc(i.name)}</h2><span class="small">${status(i)}</span></div>${ib('x','Close preview','close-preview')}</div><p class="inspector-description">${esc(i.description)}</p><div class="inspector-actions">${primary(i,'primary')}${enabled(i)&&i.kind==='app'?btn(icon('message-circle')+' Try in chat','try',i.id):''}</div>${added?`<div class="inspector-tabs" role="tablist" aria-label="${esc(i.name)} views"><button type="button" role="tab" id="overview-tab" aria-controls="inspector-content" aria-selected="${!settings}" data-action="detail-tab" data-id="overview">Overview</button><button type="button" role="tab" id="settings-tab" aria-controls="inspector-content" aria-selected="${settings}" data-action="detail-tab" data-id="settings">Settings</button></div>`:''}<div id="inspector-content"${added?` role="tabpanel" aria-labelledby="${settings?'settings':'overview'}-tab"`:''}>${settings?settingsContent(i):`<p class="inspector-description">${esc(i.detail)}</p><div class="preview"><div class="preview-bar">${icon(i.kind==='app'?'layout-grid':'message-circle')}<span>${i.kind==='app'?'Inside '+esc(i.name):'Example in chat'}</span><span class="small">Sample</span></div><div class="preview-content">${previewContent(i)}</div></div><div class="capabilities"><span>${icon('message-circle')}Works in chat</span>${i.kind==='app'?`<span>${icon('layout-grid')}Opens in Ri</span>`:''}</div>${!added?`<p class="small">${i.kind==='connection'?'Connect an account to bring it into your conversations.':'Add it once, then use it wherever you work with Ri.'}</p>`:''}`}</div></aside>`;}

  function chatView(){const i=get(state.selected);return pageHead(i?'Chat with '+i.name:'Chat with Ri',i?'Available in this conversation':'A place to think and work.',btn(icon('arrow-left')+' Apps','back-browse','','quiet'), 'message-circle')+`<div class="chat-page"><section class="transcript" aria-label="Chat messages"><div class="transcript-inner"><div><div class="speaker"><span class="brand">Ri</span>Ri</div><p class="chat-body">${i?`${esc(i.name)} is ready to use. Tell me what you’d like to work on.`:'What would you like to work on?'}</p>${i?`<div class="capabilities"><span>${mark(i,true)}${esc(i.name)}</span></div>`:''}</div>${messages.map(m=>m.role==='user'?`<div class="user-message">${esc(m.text)}</div>`:`<div><div class="speaker"><span class="brand">Ri</span>Ri</div><p class="chat-body">${esc(m.text)}</p></div>`).join('')}</div></section><form class="composer" data-form="chat"><textarea data-field="draft" aria-label="Message Ri" placeholder="Message Ri…">${esc(draft)}</textarea><div class="composer-bottom">${icon('at-sign')}<span>${i?esc(i.name):'Ri'}</span><span class="grow"></span><span>Claude</span>${icon('chevron-down')}<button type="submit" class="send" aria-label="Send message">${icon('arrow-up')}</button></div></form></div>`;}
  function createView(){return pageHead('Add your own','Make Ri work your way.',btn(icon('arrow-left')+' Apps','back-browse','','quiet'),'plus')+`<div class="surface"><div class="create-page"><h2>What would you like to add?</h2><div class="create-options">${[['build','hammer','Build with Ri'],['import','upload','Import'],['mcp','server','Connect MCP']].map(r=>`<button type="button" data-action="create-mode" data-id="${r[0]}" aria-pressed="${createMode===r[0]}">${icon(r[1])}${r[2]}</button>`).join('')}</div>${createMode==='build'?`<form data-form="build"><label class="field">What should Ri help you do?<textarea name="idea" rows="5" placeholder="A tracker for my subscriptions, or a workflow for writing in my voice…" required></textarea></label><button type="submit" class="btn primary">Start building</button></form>`:createMode==='mcp'?`<form data-form="mcp"><label class="field">Name<input name="name" placeholder="Company data" required></label><label class="field">Server address<input name="url" type="url" placeholder="https://example.com/mcp" required></label><button type="submit" class="btn primary">Add connection</button><p class="small" style="margin-top:15px">This prototype saves a sample connection. It does not contact a server.</p></form>`:`<label class="field">Choose a skill or app package<input type="file" data-field="import" accept=".md,.zip,.tgz,.gz"></label><p class="small">This prototype uses the file name for a sample addition. File contents are not read or uploaded.</p>`}</div></div>`;}
  function render(options={}){
    const catalogScroll=root.querySelector('.catalog-scroll')?.scrollTop??returnScroll;
    const inspectorScroll=root.querySelector('.inspector')?.scrollTop??0;
    const active=document.activeElement;
    const inputFocus=active?.dataset?.field==='query';
    const selectionStart=inputFocus?active.selectionStart:null;
    const target=options.focus;
    document.documentElement.style.colorScheme=state.theme==='system'?'light dark':state.theme;
    const content=['discover','library'].includes(state.view)?browse():state.view==='app'?appView():state.view==='chat'?chatView():createView();
    root.innerHTML=hud()+`<div class="shell${state.railOpen?'':' collapsed'}">${rail()}<main class="main">${notice?`<div class="notice" role="status">${icon('check')}<span>${esc(notice)}</span>${ib('x','Dismiss message','dismiss')}</div>`:''}${content}</main></div><nav class="mobile-nav" aria-label="Ri mobile navigation"><button type="button" data-action="new-chat">${icon('message-circle')}Ri</button><button type="button" data-action="context" data-id="Task Board">${icon('square-kanban')}Tasks</button><button type="button" data-action="discover" aria-current="page">${icon('layout-grid')}Apps</button><button type="button" data-action="context" data-id="Agents">${icon('bot')}Agents</button><button type="button" data-action="create">${icon('plus')}Create</button></nav>`;
    const scroll=root.querySelector('.catalog-scroll');if(scroll)scroll.scrollTop=options.top?0:catalogScroll;
    const inspectorEl=root.querySelector('.inspector');if(inspectorEl)inspectorEl.scrollTop=options.inspectorTop?0:inspectorScroll;
    if(inputFocus){const input=root.querySelector('[data-field="query"]');if(input){input.focus({preventScroll:true});try{input.setSelectionRange(selectionStart,selectionStart);}catch{}}}
    else if(target){const next=root.querySelector(target);if(next)next.focus({preventScroll:true});}
    if(options.revealInspector&&matchMedia('(max-width:760px)').matches)inspectorEl?.scrollIntoView({block:'start'});
  }
  function beginBrowse(view='discover'){state.view=view;state.selected=null;state.query='';state.filter='All';state.collection=null;notice='';confirmRemove=false;returnScroll=0;}
  function openDetails(id,settings=false){
    if(!get(id))return;
    if(!['discover','library'].includes(state.view))state.view=previousView;
    state.selected=id;lastSelected=id;state.detailTab=settings?'settings':'overview';confirmRemove=false;
  }
  function add(id){const i=get(id);if(!i)return;if(!isAdded(i)){state.added.push(id);justAdded.push(id);}state.off=state.off.filter(v=>v!==id);notice=i.kind==='connection'?`${i.name} connected to a sample Work account.`:`${i.name} added to this prototype.`;}
  function rememberBrowse(){if(['discover','library'].includes(state.view)){previousView=state.view;returnScroll=root.querySelector('.catalog-scroll')?.scrollTop||0;}}
  function startChat(id,idea=''){rememberBrowse();state.view='chat';state.selected=get(id)?id:null;draft=idea||(get(id)?.sample||'');messages=[];}
  root.addEventListener('click',event=>{
    const button=event.target.closest('button[data-action]');if(!button)return;
    const action=button.dataset.action,id=button.dataset.id,i=get(id);let options={};notice='';
    if(action==='discover'){beginBrowse();options.top=true;}
    else if(action==='library'){beginBrowse('library');options.top=true;}
    else if(action==='details'||action==='manage'){openDetails(id,action==='manage');options={inspectorTop:true,revealInspector:true,focus:'.inspector [data-action="close-preview"]'};}
    else if(action==='detail-tab'){state.detailTab=id;confirmRemove=false;options={inspectorTop:true,focus:`[data-action="detail-tab"][data-id="${id}"]`};}
    else if(action==='close-preview'){state.selected=null;confirmRemove=false;options.focus=`[data-action="details"][data-id="${lastSelected}"]`;}
    else if(action==='add'){add(id);options.focus=state.selected===id?'.inspector .primary':`[data-item="${id}"] .btn`;}
    else if(action==='open'&&i){if(!enabled(i)){openDetails(id,true);options.revealInspector=true;}else{rememberBrowse();state.view='app';state.selected=id;appTab=i.id==='finances'?'Overview':i.id==='people'?'People':'Itinerary';}}
    else if(action==='try'&&i){if(!enabled(i))openDetails(id,true);else startChat(id);}
    else if(action==='back-browse'){state.view=previousView;state.selected=null;confirmRemove=false;}
    else if(action==='filter'){state.filter=id;state.collection=null;options.top=true;}
    else if(action==='clear'){state.query='';options.focus='[data-field="query"]';}
    else if(action==='collection'){state.collection=id;state.query='';state.filter='All';state.selected=null;options.top=true;}
    else if(action==='clear-collection'){state.collection=null;options.top=true;}
    else if(action==='add-collection'){const c=collections.find(v=>v.id===id);c?.items.filter(id=>!state.added.includes(id)).forEach(add);notice='The missing additions are ready in this prototype.';}
    else if(action==='toggle'){state.off=state.off.includes(id)?state.off.filter(v=>v!==id):[...state.off,id];options.focus='.inspector [data-action="toggle"]';}
    else if(action==='pin'){state.pinned=state.pinned.includes(id)?state.pinned.filter(v=>v!==id):[...state.pinned,id];options.focus='.inspector [data-action="pin"]';}
    else if(action==='remove'){confirmRemove=true;options.focus='.inspector [data-action="cancel-remove"]';}
    else if(action==='cancel-remove'){confirmRemove=false;options.focus='.inspector [data-action="remove"]';}
    else if(action==='confirm-remove'){state.added=state.added.filter(v=>v!==id);state.off=state.off.filter(v=>v!==id);state.pinned=state.pinned.filter(v=>v!==id);delete state.settings[id];state.detailTab='overview';confirmRemove=false;notice=`${i.name} removed from this prototype.`;options.focus='.inspector .primary';}
    else if(action==='create'||action==='create-build'){rememberBrowse();state.view='create';createMode='build';}
    else if(action==='create-mode'){createMode=id;}
    else if(action==='new-chat'){startChat(null);}
    else if(action==='edit-skill'){startChat(id,'Help me customize '+i.name+'.');}
    else if(action==='app-tab'){appTab=id;options.focus=`[data-action="app-tab"][data-id="${id}"]`;}
    else if(action==='collapse'){state.railOpen=!state.railOpen;}
    else if(action==='accounts'){beginBrowse('library');state.query='account';options.top=true;}
    else if(action==='search'){beginBrowse();options={top:true,focus:'[data-field="query"]'};}
    else if(action==='theme'){const currentlyDark=state.theme==='dark'||state.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches;state.theme=currentlyDark?'light':'dark';}
    else if(action==='reset'){state=defaults();justAdded=[];messages=[];notice='Prototype reset.';options.top=true;}
    else if(action==='context'){notice=`${id} stays in its existing Ri view. This prototype focuses on Apps.`;}
    else if(action==='dismiss'){notice='';}
    save();render(options);
  });
  root.addEventListener('input',event=>{
    if(event.target.dataset.field==='query'){state.query=event.target.value;render({top:true});}
    if(event.target.dataset.field==='draft')draft=event.target.value;
    if(event.target.dataset.setting==='instructions'&&state.selected){state.settings[state.selected]={...settingsFor(get(state.selected)),instructions:event.target.value};save();}
  });
  root.addEventListener('change',event=>{
    const key=event.target.dataset.setting;
    if(key&&state.selected){state.settings[state.selected]={...settingsFor(get(state.selected)),[key]:event.target.value};save();}
    if(event.target.dataset.field==='import'&&event.target.files?.length){
      const file=event.target.files[0],name=file.name.replace(/\.(md|zip|tgz|gz)$/i,'').replace(/[-_]/g,' ');
      const id='custom-'+Date.now().toString(36);
      state.custom.push({id,name,icon:'book-open',tone:'purple',kind:'skill',group:'Create',description:'Your imported way of working.',detail:'An imported workflow, ready to customize with Ri.',sample:'Help me use '+name+'.',keywords:'custom skill imported workflow'});
      add(id);state.view='library';state.selected=id;state.detailTab='settings';notice='Sample addition created from the file name. Nothing was uploaded.';save();render({top:true,revealInspector:true});
    }
  });
  root.addEventListener('submit',event=>{
    const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();
    const type=form.dataset.form,values=new FormData(form);
    if(type==='chat'){
      if(!draft.trim())return;
      messages.push({role:'user',text:draft.trim()},{role:'assistant',text:'This is a sample conversation. In Ri, your agent would continue here using the additions you chose.'});draft='';render({focus:'[data-field="draft"]'});const transcript=root.querySelector('.transcript');transcript.scrollTop=transcript.scrollHeight;return;
    }
    if(type==='build'){startChat(null,String(values.get('idea')||''));notice='Your idea is ready in the preview chat.';}
    if(type==='server'){state.settings[state.selected]={...settingsFor(get(state.selected)),url:String(values.get('serverUrl'))};notice='Sample connection saved. No server was contacted.';}
    if(type==='mcp'){
      const name=String(values.get('name')).trim(),url=String(values.get('url')).trim();
      if(!/^https?:\/\//i.test(url)){notice='Use an HTTP or HTTPS server address.';render();return;}
      const id='custom-'+Date.now().toString(36);
      state.custom.push({id,name,icon:'database',tone:'blue',kind:'mcp',group:'Work',description:'Your custom connection to company tools.',detail:'Bring this server’s information and tools into conversations with Ri.',sample:'What can I do with '+name+'?',keywords:'custom mcp server connection'});
      state.settings[id]={url};add(id);state.view='library';state.selected=id;state.detailTab='settings';notice='Sample connection added. No server was contacted.';
    }
    save();render({top:type==='mcp',revealInspector:type==='mcp'});
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.selected&&['discover','library'].includes(state.view)){state.selected=null;confirmRemove=false;render({focus:`[data-action="details"][data-id="${lastSelected}"]`});}
    if(event.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
      event.preventDefault();state.detailTab=event.key==='Home'?'overview':event.key==='End'?'settings':state.detailTab==='overview'?'settings':'overview';render({focus:`[data-action="detail-tab"][data-id="${state.detailTab}"]`});
    }
  });
  render();
})();
</script>
</body>
</html>
