# Explicit globs only — do NOT switch to auto-discovery. Without an explicit
# `packages` field, pnpm 10 auto-discovers nested package.json files, including
# untracked clones under /examples (gitignored reference material), whose git
# deps then break `pnpm install` for everyone. List packages one-by-one here.
packages:
  - "packages/connectors"
allowBuilds:
  better-sqlite3: true
