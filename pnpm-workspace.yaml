# Explicit globs only — do NOT switch to auto-discovery. Without an explicit
# `packages` field, pnpm 10 auto-discovers nested package.json files, including
# untracked clones under /examples (gitignored reference material), whose git
# deps then break `pnpm install` for everyone. List packages one-by-one here.
packages:
  - "packages/integrations"
  - "packages/app-kit"
  - "packages/mcp-apps-host"
  - "apps/finances"
  - "apps/people"
  - "apps/travel"
  - "apps/job-search"
# Dependency install scripts run only where listed true. The packages listed
# false work from what they publish (prebuilt binaries, platform packages), so
# their scripts are skipped. node-pty must stay true: its postinstall makes
# spawn-helper executable, and the terminal cannot start a shell without it.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: false
  msw: false
  node-pty: true
  pnpm: false
  sharp: false
  tesseract.js: false
  unrs-resolver: false
patchedDependencies:
  '@agentex/agent@0.0.48': patches/@agentex__agent@0.0.48.patch
# Our agentex releases are taken up immediately. Other packages keep the wait.
minimumReleaseAgeExclude:
  - "@agentex/*"
